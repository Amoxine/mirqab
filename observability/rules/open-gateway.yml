# Alert rules (WP20). Six rules, one per detection signal §5 names.
#
# There is no Alertmanager (§9): "the alert fires" means `ALERTS{alertstate="firing"}` comes back
# from the query API. Every rule below has been driven to `firing` against the running stack, by
# real traffic or by a named fault injection — a rule nobody has ever seen fire is a rule that does
# not work yet.
#
# Thresholds marked PLACEHOLDER need a baseline from real traffic before they mean anything; they
# are set so the condition is reachable, not so it is correct for production volume.

groups:
  - name: open-gateway
    rules:
      # ── 1. Latency ──────────────────────────────────────────────────────────
      # tyk-pump's `tyk_latency` buckets are MILLISECONDS, not seconds (verified on pump 1.17.0),
      # so "p95 > 1s" is `> 1000`. `type="total"` is what the client experienced (gateway +
      # upstream); `type="gateway"` alone would hide a slow upstream, which is the usual cause.
      - alert: GatewayLatencyP95High
        expr: histogram_quantile(0.95, sum by (le, api) (rate(tyk_latency_bucket{type="total"}[5m]))) > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'p95 latency above 1s for {{ $labels.api }}'
          description: 'p95 total latency is {{ $value | humanize }}ms, sustained for 5 minutes.'

      # ── 2. Redis evictions (R3) ─────────────────────────────────────────────
      # The instance runs `noeviction`, so in steady state this counter cannot move: an eviction
      # here means the policy was changed out from under the deployment, and the failure mode it
      # restores is the silent one — a live API key simply stops authenticating.
      - alert: RedisEvictingKeys
        expr: redis_evicted_keys > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'Redis {{ $labels.redis }} has evicted keys'
          description: '{{ $value }} keys evicted. With maxmemory-policy=noeviction this should be impossible; a live session or quota counter may have been dropped.'

      # ── 3. Redis memory (R3) ────────────────────────────────────────────────
      # `(redis_maxmemory_bytes > 0)` is a filter, not a comparison: an unbounded instance reports
      # maxmemory 0 and would otherwise divide to +Inf and fire forever.
      #
      # One series per instance, so this is "both instances" whenever there are two. There is one
      # today — spike S4(c) proved Tyk OSS 5.15 ignores TYK_GW_ANALYTICSSTORAGE_*, so the keys /
      # analytics-buffer split R3 assumes does not exist (see infra/docker-compose.yml).
      - alert: RedisMemoryHigh
        expr: redis_used_memory_bytes / (redis_maxmemory_bytes > 0) > 0.8
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: 'Redis {{ $labels.redis }} above 80% of maxmemory'
          description: 'used_memory/maxmemory is {{ $value | humanizePercentage }}. Under noeviction the next step is hard write failures (ERR OOM), not eviction.'

      # ── 4. WAF would-block rate (R16) ───────────────────────────────────────
      # 949110 "Inbound Anomaly Score Exceeded" is the rule that decides a block. The engine is
      # DetectionOnly (WP26b), so this counts requests that WOULD have been blocked; it becomes the
      # literal block rate, with no change here, if SecRuleEngine is ever flipped on.
      #
      # A spike is the signature of a CRS false positive breaking real traffic: 403s at the edge
      # that never reach Tyk, so `tyk_http_requests_total` stays flat and the dashboard shows
      # nothing at all.
      #
      # PLACEHOLDER threshold: set it from the detect-first week's own baseline (WP26b, §9).
      - alert: CorazaWouldBlockSpike
        expr: sum(increase(coraza_rule_detections_total{rule_id="949110"}[5m])) > 10
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: 'WAF would-block rate spiking at the edge'
          description: '{{ $value | humanize }} requests in 5 minutes crossed the CRS anomaly threshold. Check infra/edge/Caddyfile exclusions before assuming an attack.'

      # ── 5. Edge certificate expiry (R14) ────────────────────────────────────
      # The ROOT only, and that is measured rather than lazy: Caddy's `tls internal` issues 12-HOUR
      # leaves off a 7-DAY intermediate (verified on the running edge), so a 14-day threshold is
      # permanently true for both and would be a permanently firing alert. The root is the one
      # certificate where 14 days is a real warning — it lasts 10 years, every client installs it by
      # hand (infra/edge/README.md), and its expiry breaks all of them at once.
      - alert: EdgeRootCertificateExpiringSoon
        expr: edge_certificate_expiry_timestamp_seconds{role="root"} - time() < 14 * 24 * 3600
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'Edge root CA {{ $labels.cn }} expires within 14 days'
          description: 'Every client that installed infra/edge/root.crt stops trusting the edge when this expires.'

      # ── 5b. Edge leaf / intermediate renewal (R14, WP29a) ───────────────────
      # The other half of R14, and it is a DIFFERENT rule rather than a second threshold on rule 5
      # because the served certificates cannot be expressed in absolute days at all: `tls internal`
      # issues a 12-HOUR leaf off a 7-DAY intermediate (both measured on this edge), so any
      # days-remaining threshold is either permanently true or shorter than the renewal interval.
      #
      # FRACTION of lifetime remaining is scale-free and asks the question that matters: Caddy
      # renews at roughly one third of the lifetime left, so a healthy leaf sawtooths between 1.0
      # and ~0.33 and never reaches 0.25. Crossing it means renewal did not happen — which is the
      # actual R14 failure, not the expiry itself. The same 0.25 reads correctly on the 7-day
      # intermediate without a second number.
      #
      # `role!="root"` rather than a leaf/intermediate enumeration: the root has its own rule above,
      # and anything else the edge grows a certificate for should be watched by default rather than
      # silently uncovered until someone remembers to add it here.
      #
      # `for: 15m` covers a scrape or two failing over a renewal — the gauges are ABSENT, not stale,
      # when the TLS probe fails, so this cannot fire on a missing series.
      - alert: EdgeCertificateRenewalStalled
        expr: |
          (edge_certificate_expiry_timestamp_seconds{role!="root"} - time())
            / edge_certificate_lifetime_seconds{role!="root"} < 0.25
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: 'Edge {{ $labels.role }} certificate for {{ $labels.cn }} is not being renewed'
          description: '{{ $value | humanizePercentage }} of its validity period is left. Caddy renews at about a third remaining, so this means renewal is failing, not that expiry is merely approaching. Check `docker compose logs edge` for tls.obtain / tls.renew errors.'

      # ── 6. Node drift (R2) ──────────────────────────────────────────────────
      # ReconcileService recomputes syncState every 60s, so `for: 2m` is two ticks — long enough
      # that a write in flight to three nodes does not page anyone.
      - alert: GatewayNodesOutOfSync
        expr: gateway_nodes_in_sync < gateway_nodes_total
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: 'Only {{ $value }} gateway nodes hold every definition identically'
          description: 'A node is missing a definition or holds a different one. POST /apis/:id/sync re-pushes it.'

      # ── 7-11. The rules that fire when the rules above CANNOT ───────────────
      # Every rule above reads a gauge that `MetricsService` RESETS when its probe fails
      # (metrics.service.ts: Redis :210-212, gateway sync :232, certificates :258-259). That was a
      # deliberate choice — a stale value lies to a rule that cannot tell stale from current — but
      # absence is not free either: in PromQL a missing series makes the whole expression yield an
      # empty vector, so the alert does not fire, it goes SILENT. Verified against this Prometheus:
      #
      #   (edge_certificate_expiry_timestamp_seconds{role="nonexistent"} - time())
      #     / edge_certificate_lifetime_seconds{role="nonexistent"} < 0.25   ->  0 results
      #
      # So every rule above had a matching failure mode in which it reports nothing and reads
      # exactly like health. The worst was R14's own scenario: if the edge's TLS endpoint goes
      # unreachable the leaf gauges vanish and EdgeCertificateRenewalStalled stops evaluating —
      # the edge being DOWN produced no alert at all, while up{job="open-gateway-api"} stayed 1,
      # because Prometheus scrapes the api directly and never touches the edge.
      #
      # These four make the silence audible. They were missed in WP20's own six-rule review because
      # that review checked every rule fires when it should, and never that a rule stays silent when
      # it should not be able to.
      #
      # Deliberately NOT here: `absent(coraza_rule_detections_total)`. That counter legitimately has
      # no series until the first WAF detection, so an absence alert on it fires on every clean
      # stack — an alert that is wrong at rest is worse than the gap it closes.
      - alert: MetricsTargetDown
        expr: up{job=~"open-gateway-api|tyk-pump|otel-collector"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'Prometheus cannot scrape {{ $labels.job }}'
          description: 'Every rule reading this target is blind for as long as this lasts, reporting no data rather than a problem. 2m is ~8 missed scrapes at the 15s interval.'

      # The three below are gated on `up{job="open-gateway-api"} == 1`, which is a real design
      # choice and not decoration: these gauges are exported BY the api, so without the gate an api
      # outage fires all four of these rules at once for a single root cause. With it,
      # MetricsTargetDown owns "the api is gone" and each rule below means the narrower, separately
      # actionable thing — "the api is up and answering, but THIS probe inside it is failing".
      #
      # `and on()` joins on the empty label set, which is what lets a one-element absent() vector
      # match the `up` series despite sharing no labels with it.
      #
      # `for: 10m` on all three: these say the observability is blind, not that the product is
      # down, and 10 minutes is long enough to ride out a restart or a flaky handshake while still
      # being well inside the window where blindness matters.
      - alert: EdgeCertificateMetricsAbsent
        expr: |
          (absent(edge_certificate_expiry_timestamp_seconds{role="root"})
            or absent(edge_certificate_expiry_timestamp_seconds{role="leaf"}))
            and on() (up{job="open-gateway-api"} == 1)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Edge certificate metric for role={{ $labels.role }} is absent, so its expiry rules are silent'
          description: 'role="root" means the api cannot read EDGE_ROOT_CERT_PATH — infra/edge/root.crt must exist AND be world-readable (`docker compose cp` leaves it 0600; see infra/edge/README.md), and that exact case has bitten this stack before. role="leaf" means the TLS probe of EDGE_TLS_PROBE is failing, which usually means the edge itself is unreachable. EdgeRootCertificateExpiringSoon and EdgeCertificateRenewalStalled cannot fire while this is true.'

      - alert: RedisMetricsAbsent
        expr: absent(redis_used_memory_bytes) and on() (up{job="open-gateway-api"} == 1)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Redis metrics are absent, so the R3 rules are silent'
          description: 'The api reset these after a failed INFO call, so it is up but cannot reach Redis. RedisEvictingKeys and RedisMemoryHigh cannot fire while this is true — and an unreachable Redis is itself the outage those rules exist to warn about.'

      - alert: GatewaySyncMetricsAbsent
        expr: absent(gateway_nodes_in_sync) and on() (up{job="open-gateway-api"} == 1)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'gateway_nodes_in_sync is absent, so the drift rule is silent'
          description: 'The api reset this after a failed syncState read from Postgres. gateway_nodes_total is set before that read and SURVIVES, so GatewayNodesOutOfSync compares a present value against a missing one and yields nothing at all — it reads exactly like "no drift".'
