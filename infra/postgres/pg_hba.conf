# Client authentication (WP29a).
#
# This file exists for ONE line — the last one. The postgres image generates its pg_hba.conf at
# initdb time and the entrypoint appends `host all all all scram-sha-256` on every boot, but neither
# ever adds a REPLICATION rule for a non-loopback client. `pg_basebackup` always opens a replication
# connection (with or without -X), so the scheduled base backup in docker-compose.yml fails with
# "no pg_hba.conf entry for replication connection from host ..." until that rule exists.
#
# Everything above the replication line is a verbatim copy of what the image generated, so pointing
# postgres at this file with `-c hba_file=` changes nothing else. Keep it that way: this is not the
# place to tighten the app's own auth, because getting it wrong locks every service out of the
# database at once.
#
# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust

# Base backups from the postgres-backup container. Password-authenticated and scoped to the one
# role that holds DB_PASS — never `trust`, which would let anything that can reach 5432 stream the
# whole cluster without a credential.
host    replication     opengateway     all                     scram-sha-256

# The image's own appended rule, restated here because a custom hba_file replaces it.
host    all             all             all                     scram-sha-256
