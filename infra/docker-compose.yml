name: Open Gateway Infrastructure
#
# Full stack: Postgres, Redis, Tyk OSS Gateway, NestJS API, Next.js web.
#   docker compose -f infra/docker-compose.yml up -d
#
# Only the open-source Tyk Gateway is used (no Tyk Dashboard). The API manages the gateway through
# its REST API: TYK_ADMIN_URL=<gateway>/tyk, secret = TYK_GW_SECRET (header x-tyk-authorization).
#
# Secrets live in infra/.env (git-ignored, written by install.sh):
#   JWT_SECRET               required — the stack refuses to start without it
#   DB_PASS                  required — the shared Postgres password (app DB + Hydra/Kratos/Keto DSNs)
#   HYDRA_SECRETS_SYSTEM     required — Hydra
#   HYDRA_SECRETS_COOKIE     required — Hydra
#   KRATOS_SECRETS_DEFAULT   required — Kratos
#   KRATOS_SECRETS_COOKIE    required — Kratos
#   KRATOS_SECRETS_CIPHER    required — Kratos (must be exactly 32 characters)
#   TYK_WEBHOOK_RELAY_SECRET required — the api; Tyk's event handler presents it to the @Public()
#                            relay endpoint, which is what separates a real Tyk event from a forged
#                            one (the endpoint is reachable through the edge, not only in-network)
#   PG_EXPORTER_PASSWORD     the og_monitor role postgres-exporter logs in as (OG-OBS-02). NOT `:?`
#                            here, on purpose: unset, pg-monitoring-init exits 1 and the exporter
#                            reports pg_up 0, and NOTHING waits on either, so the rest of the stack
#                            starts normally (see pg-monitoring-init); the prod overlay requires it
#   TYK_GW_SECRET            falls back to a well-known dev value below; that default is only safe
#                            because the gateway's control API (/tyk/*) is NOT published to the host
#                            (see TYK_GW_CONTROLAPIPORT). Set it for anything reachable by someone else.
#
# Published ports (WP26b): the `edge` service is the ONLY thing that publishes an application port.
# It terminates TLS and runs the WAF on 33000 web, 33001 api, 33005 gateway DATA plane, 33010 Hydra
# public and 33012 Kratos public — the same port numbers as before, now HTTPS. web/api/tyk-gateway/
# hydra/kratos carry `expose:` instead of `ports:`; that is load-bearing, not tidiness, because a LAN
# client that can still reach Tyk directly on 33005 forges its own X-Forwarded-For and defeats the
# per-client rate limits and (WP15c) the IP deny list. Postgres (33002), Redis (33003), Hydra admin
# (33011), Kratos admin (33013) and Keto read/write (33014/33015) are bound to 127.0.0.1 — every one
# of those Ory admin APIs is UNAUTHENTICATED and none of them is routed through the edge. The gateway
# control API (8081) and pump health (8083) are not published at all. node-exporter (OG-OBS-01) is
# the one listener outside compose networking: it runs in the host network namespace and binds the
# docker0 gateway address only, never the LAN — see that service.
#
# Ory (Hydra/Kratos/Keto) is the auth system: the API's JwtStrategy validates only Hydra-issued
# JWTs, and the old local login/register/refresh routes are gone. WP7 owns removing the now-dead
# code paths and updating docs to match — this stack has already cut over.
#
# Two networks, not one, and this split is load-bearing for security, not just tidiness:
# `ory-internal` carries postgres + hydra/kratos/keto (all three admin APIs unauthenticated).
# `tyk-gateway`/`tyk-pump` are deliberately NOT on it — proxy_url.validator.ts's SSRF denylist
# blocks those services by hostname, but a hostname denylist cannot block a raw container IP
# (RFC1918 has to stay allowed for legitimate self-hosted upstreams), so an attacker who sets
# `proxyUrl` to Hydra's actual IP would otherwise still reach it through the gateway. Putting the
# Ory containers on a network the gateway has no route to closes that at the layer a DTO check
# never can: even a raw-IP request from tyk-gateway now has nowhere to go. `api`/`web` (which
# legitimately call Hydra/Kratos/Keto) and `postgres` (which every Ory service's DSN points at)
# are on both networks.
#
# tyk-gateway/tyk-pump still reach redis/postgres/api/web on `open-gateway-network` by raw IP —
# that's fine ONLY because none of those trust network origin for authz: redis has no password but
# actively drops HTTP-shaped connections (it's not proxyable), postgres isn't HTTP either, and
# api/web require a real JWT on everything but a couple of public routes. The invariant this split
# actually rests on: never add a service to `open-gateway-network` that is unauthenticated OR
# trusts which network a request came from — that's what put Hydra/Kratos/Keto here in the first
# place, and the SSRF denylist can catch a stale hostname but structurally cannot catch this.
# The monitoring services are the accepted exception: unauthenticated, reachable by raw IP (a tenant
# proxyUrl through the gateway included), and each deliberately limited to what is listed here —
# none can write to, mint in or reconfigure the stack:
#   prometheus         the query API reads every stored metric; no admin or lifecycle API is enabled.
#   node-exporter      host metrics (on the docker0 address, not this network — see that service).
#   cadvisor           per-container metrics plus its read-only container-inventory API.
#   redis-exporter     /metrics only: /scrape is disabled and key VALUES are never exported, so no
#                      request can make it read a key with its stored password (review H1).
#   postgres-exporter  /metrics, plus /probe, which v0.20.1 cannot disable: it opens a Postgres
#                      connection to ANY host the caller names — with the caller's own credentials
#                      only; og_monitor's are never sent (lab-verified against a fake server, M2).
#   blackbox           GET/TCP probes to any target the caller names, from inside this network.
# A separate `monitoring` network (or a scrape-side proxy) is the upgrade if any of that is too much.
#
# Shared gateway configuration (WP13a). Every node — the default one and the two the `multinode`
# profile adds — runs byte-identical config, because a per-node difference would show up as
# permanent drift: ReconcileService hashes the definition each node reports, and Tyk's injected
# defaults are only identical across nodes when the nodes are configured (and versioned) alike.
# Node-specific settings stay inline on each service; nothing node-specific belongs in here.
x-tyk-gateway-env: &tyk-gateway-env
    TYK_GW_LISTENPORT: "8080"
    # Control API (/tyk/*) on its own port, which is deliberately NOT published: on the shared data
    # port anyone who could reach a published API could also reach the admin API. Verified on
    # v5.15.0: with this set, :8080 answers 404 for /tyk/* AND for /hello — both move to :8081.
    TYK_GW_CONTROLAPIPORT: "8081"
    TYK_GW_SECRET: ${TYK_GW_SECRET:-tyk-gateway-secret}
    TYK_GW_USEDBAPPCONFIGS: "false"
    TYK_GW_STORAGE_TYPE: redis
    TYK_GW_STORAGE_HOST: redis
    TYK_GW_STORAGE_PORT: "6379"
    TYK_GW_ALLOWINSECURECONFIGS: "true"
    # WP27, S2's blocking finding: absent, the identical OAS graphql-subscription api rejects the
    # WebSocket upgrade with 422. Required for WebSocket/SSE passthrough generally, not just GraphQL
    # subscriptions — live-verified on v5.15.0.
    TYK_GW_HTTPSERVEROPTIONS_ENABLEWEBSOCKETS: "true"
    # WP27: TCP passthrough. Confirmed against the v5.15.0 source (gateway/proxy_muxer.go) — a
    # protocol:"tcp" api's `listen_port` is refused ("trying to open disabled port") unless the
    # port+protocol is in TYK_GW_PORTWHITELIST or this is set. Same tradeoff shape as
    # ALLOWINSECURECONFIGS above: broadens what the gateway will bind rather than naming one port,
    # which is why the dedicated TCP port is the ONLY thing allowed to reach the gateway on a port
    # other than the published data plane (infra/docker-compose.yml's tyk-gateway `ports:`) and the
    # unpublished control API.
    TYK_GW_DISABLEPORTWHITELIST: "true"
    # Analytics: buffer records in Redis (empty TYPE) for tyk-pump to purge into Postgres.
    TYK_GW_ENABLEANALYTICS: "true"
    TYK_GW_ANALYTICSCONFIG_TYPE: ""
    TYK_GW_ANALYTICSCONFIG_ENABLEDETAILEDRECORDING: "false"
    TYK_GW_ANALYTICSCONFIG_STORAGEEXPIRATIONTIME: "3600"
    TYK_GW_HASHKEYS: "true"
    # Org-scoped cutoff (WP12c). Every definition, policy and key is stamped with its tenant's
    # `Tenant.tykOrgId`, so `POST /tyk/org/keys/<org> {is_inactive:true}` disables exactly one
    # tenant. BOTH of these are required to make that work, and the failure mode when either is
    # missing is silent: the call still answers 200 {"status":"ok"} and the keys keep working.
    # Verified on v5.15.0 — neither flag alone has any effect; with both, the cutoff lands in
    # under 5 s. An org that has no org-session at all is unaffected, so enabling these does not
    # retroactively restrict anything.
    TYK_GW_ENFORCEORGQUOTAS: "true"
    TYK_GW_ENFORCEORGDATAAGE: "true"
    # Policies — the rate / quota / access-rights record a JWT is mapped to — live as one JSON file
    # per policy in this directory, written by the API through POST /tyk/policies. Without
    # POLICYPATH the gateway answers 500 "Failed to create file!". ALLOWEXPLICITPOLICYID has to be
    # on: an OAuth2 client's policy id IS its client id, which is how Tyk maps its tokens
    # (see apps/api/src/modules/oauth-clients/services/oauth-client-mapper.ts).
    TYK_GW_POLICIES_POLICYSOURCE: file
    TYK_GW_POLICIES_POLICYPATH: /opt/tyk-gateway/policies
    TYK_GW_POLICIES_ALLOWEXPLICITPOLICYID: "true"
    # OpenTelemetry (WP20). The gateway is the MIDDLE span of the chain: it continues the trace the
    # edge started (W3C traceparent, injected by Caddy's `tracing` directive) and propagates it to
    # the upstream, which is what lets one request read as edge -> gateway -> api -> postgres.
    # In the anchor, not inline, because every node must run identical config (see above).
    TYK_GW_OPENTELEMETRY_ENABLED: "true"
    TYK_GW_OPENTELEMETRY_EXPORTER: grpc
    TYK_GW_OPENTELEMETRY_ENDPOINT: otel-collector:4317
    # `simple` exports each span as it ends. A batch processor would make every trace assertion in
    # §6 depend on a flush interval, and this gateway's span volume is nowhere near needing batching.
    TYK_GW_OPENTELEMETRY_SPANPROCESSORTYPE: simple
    TYK_GW_OPENTELEMETRY_SAMPLING_TYPE: AlwaysOn
    TYK_GW_OPENTELEMETRY_RESOURCENAME: open-gateway-tyk

# Log cap for EVERY service (OG-OBS-01, ADR-OBS-07 in docs/ha-observability/04 §5). Docker's json-file
# driver is unbounded by default, so one chatty container (a WAF storm, a debug exporter, a crash
# loop) fills the host disk and takes Postgres down with it. 5 × 50 MB per container is sized
# generously on purpose: `docker logs` is the only log store this stack has (L0, no Loki), so the cap
# is also how much forensic history survives. `docker inspect <c> --format '{{.HostConfig.LogConfig}}'`
# must show it on every container (AT-4). The prod overlay repeats this anchor — YAML anchors do not
# cross files — for the one service it defines itself.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  # ─── Edge: TLS termination + WAF (WP26b) ───────────────
  # The only service that publishes an application port. Custom Caddy build (infra/edge/Dockerfile)
  # with OWASP Coraza + CRS 4 linked in; route table and WAF config in infra/edge/Caddyfile.
  #
  # On both networks because it fronts web/api/tyk-gateway (open-gateway-network) and hydra/kratos
  # (ory-internal). That does not weaken the split documented above: the edge routes only surfaces
  # that were already published, never an admin API, and it trusts nothing about which network a
  # request arrived on. api and web already straddle both networks for the same reason.
  edge:
    build:
      context: ./edge
    image: open-gateway-edge:wp26b
    container_name: open-gateway-edge
    logging: *default-logging
    restart: unless-stopped
    environment:
      # The host's LAN address, so `tls internal` also issues for https://<lan-ip>:<port>. Unset,
      # the listeners still answer on localhost. install.sh writes it into infra/.env.
      EDGE_LAN_IP: ${EDGE_LAN_IP:-127.0.0.1}
      # WP20 — Caddy's `tracing` directive has no Caddyfile options for the exporter; it is
      # configured entirely by the OTel SDK's own environment variables. Default protocol is gRPC,
      # stated here rather than relied on.
      OTEL_SERVICE_NAME: open-gateway-edge
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      # WP29a: the gateway node(s) this edge proxies the data plane to, space separated. Default is
      # the single node, because tyk-gateway-2/3 exist only under --profile multinode; the prod
      # overlay sets all three. See the reverse_proxy block in infra/edge/Caddyfile.
      EDGE_GATEWAY_UPSTREAMS: ${EDGE_GATEWAY_UPSTREAMS:-tyk-gateway:8080}
    ports:
      - "33000:33000"
      - "33001:33001"
      - "33005:33005"
      - "33010:33010"
      - "33012:33012"
    expose:
      # OG-OBS-02 (ADR-OBS-04 in docs/ha-observability/04 §5): the internal metrics listener — Caddy's
      # own metrics plus a GET-only, path-allowlisted proxy to the Ory admin metrics. Plain HTTP, no
      # WAF, and NEVER in `ports:` above: it exists so Prometheus can read the Ory admin metrics
      # without joining `ory-internal`, and publishing it would hand those to the LAN instead.
      - "9180"
    volumes:
      - ./edge/Caddyfile:/etc/caddy/Caddyfile:ro
      # Named volume, not bind mount: it holds the internal CA's private key, and losing it mints a
      # new root that invalidates every client which installed the old one.
      - caddy_data:/data
      # WP20: the WAF's per-rule detections, written here by the `log waf` block in the Caddyfile
      # and tailed by the otel-collector. Shared volume rather than the docker log driver, because
      # reading container stdout would mean giving the collector the docker socket.
      - edge_logs:/var/log/caddy
    healthcheck:
      # Unlike the Tyk images this one is alpine-based, so it can run its own probe. Caddy's admin
      # API is loopback-inside-the-container only; it is never published.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/apps/http/servers"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      - web
      - api
      - tyk-gateway
      - hydra
      - kratos
    networks:
      - open-gateway-network
      - ory-internal

  # ─── PostgreSQL ────────────────────────────────────────
  # WP29a: WAL archiving is ON. `archive_mode` is a postmaster-start parameter (not reloadable), so
  # it has to be on the command line rather than in a SET — flipping it later costs a restart.
  #
  # The archive_command is the canonical `test ! -f dest && cp` form: it refuses to overwrite an
  # existing segment. That matters because a crashed postgres can re-archive a segment it already
  # archived, and a blind `cp` would replace a good segment with a partial one. A non-zero exit
  # makes postgres retry the SAME segment forever rather than skip it, which is the intended
  # failure mode — the archive is either complete or it is visibly stuck, never quietly gapped.
  #
  # `archive_timeout=300` forces a segment switch every 5 minutes on an idle stack, so the recovery
  # window is bounded by time instead of by how long it takes to fill 16 MB of WAL.
  postgres:
    image: postgres:16-alpine
    container_name: open-gateway-postgres
    logging: *default-logging
    restart: unless-stopped
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /wal_archive/%f && cp %p /wal_archive/%f
      - -c
      - archive_timeout=300
      # Only to add one replication rule the image never generates — see infra/postgres/pg_hba.conf.
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    environment:
      POSTGRES_USER: opengateway
      POSTGRES_PASSWORD: ${DB_PASS:?set DB_PASS (install.sh generates infra/.env; or openssl rand -hex 16)}
      POSTGRES_DB: opengateway
    ports:
      # Loopback only: the database must not be reachable from the LAN.
      - "127.0.0.1:33002:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Separate volume from the data directory on purpose: an archive that shares a volume with the
      # data it protects is not a backup, it is a second copy of the same failure.
      - pg_wal_archive:/wal_archive
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opengateway -d opengateway"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      pg-archive-init:
        condition: service_completed_successfully
    networks:
      - open-gateway-network
      - ory-internal

  # ─── Backup volume owner (one-shot) ────────────────────
  # Same shape as tyk-gateway-init above and for the same reason: Docker creates a named volume's
  # mount point root-owned when the path does not exist in the image, and postgres runs as uid 70 in
  # the alpine image. Without this the archive_command fails with EACCES on every segment — and
  # postgres retries a failing archive forever, so the symptom is pg_wal filling the data volume,
  # not an obvious error. pg_basebackup writes /backups as root, so only the archive needs chowning.
  pg-archive-init:
    image: postgres:16-alpine
    container_name: open-gateway-pg-archive-init
    logging: *default-logging
    command: ["sh", "-c", "chown 70:70 /wal_archive && chmod 0750 /wal_archive"]
    user: root
    volumes:
      - pg_wal_archive:/wal_archive
    networks:
      - open-gateway-network

  # ─── Scheduled Postgres base backups (WP29a) ───────────
  # A loop, not cron: the image has no crond and a one-line `sleep` loop is the whole scheduler.
  # Backups land in their own volume; `infra/scripts/pg-backup.sh` documents the restore procedure
  # it is the other half of, and docs/deployment.md carries the runbook.
  postgres-backup:
    image: postgres:16-alpine
    container_name: open-gateway-postgres-backup
    logging: *default-logging
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: opengateway
      PGPASSWORD: ${DB_PASS:?set DB_PASS (install.sh generates infra/.env; or openssl rand -hex 16)}
      # Seconds between base backups, and how many to keep. WAL older than the oldest kept backup is
      # pruned with it — an archive that outlives every base backup it could be replayed onto is
      # just disk.
      PG_BACKUP_INTERVAL: ${PG_BACKUP_INTERVAL:-86400}
      PG_BACKUP_KEEP: ${PG_BACKUP_KEEP:-7}
    entrypoint: ["/bin/sh", "/usr/local/bin/pg-backup.sh"]
    volumes:
      - ./scripts/pg-backup.sh:/usr/local/bin/pg-backup.sh:ro
      - pg_backups:/backups
      - pg_wal_archive:/wal_archive
      # OG-OBS-02: `og_backup.prom` for node-exporter's textfile collector (read-only there). Files
      # must be 0644 — node-exporter runs as `nobody` — and land by rename, never a partial write.
      - og_textfile:/textfile
    healthcheck:
      # The marker the script writes after each successful run. Stale marker = backups have stopped,
      # which is otherwise invisible until the day someone needs one.
      test: ["CMD-SHELL", "test -f /backups/.last-success && test $(( $(date +%s) - $(cat /backups/.last-success) )) -lt $(( ${PG_BACKUP_INTERVAL:-86400} * 2 ))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - open-gateway-network

  # ─── Redis ─────────────────────────────────────────────
  # WP12b (R3): was `allkeys-lru`, which can evict live API keys and quota counters under an
  # analytics burst — the gateway's `session-` / `quota-` keys and its analytics buffer are just
  # different key prefixes in the same keyspace, and `maxmemory-policy` is server-wide, so a second
  # DB index can't give them different eviction rules.
  #
  # The intended fix was a second Redis instance for the analytics buffer with its own `allkeys-lru`,
  # freeing this one for `noeviction`. **Spike S4(c) (`.omc/research`, 2026-09-21) proved that split
  # is a no-op on Tyk OSS 5.15.0**: `TYK_GW_ANALYTICSSTORAGE_*` / `ENABLESEPARATEANALYTICSSTORE` exist
  # in the binary but the gateway never dials that host (verified: a second Redis sat at `DBSIZE 0`
  # across a full traffic run). There is nothing to repoint `pump.conf` at either — pump reads
  # whatever Redis the gateway actually wrote to, which is only ever this one.
  #
  # Degrade path taken (documented caveat, not silently dropped): single Redis, `noeviction`. This
  # does not stop the Redis from filling — it changes WHAT HAPPENS when it does: `allkeys-lru` failed
  # silently (a live key just stops authenticating, no error anywhere); `noeviction` fails loudly (an
  # OOM write error, visible in the gateway's own logs) instead of quietly deauthorizing working keys.
  # That is the whole trade, and it is only safe if sized ahead of the analytics buffer's actual
  # footprint, which this compose file cannot see. `storage_expiration_time` (`:135`) already TTLs
  # analytics keys at 1h and pump drains the buffer every `purge_delay: 10s` (`pump/pump.conf:8`), so
  # steady-state usage should stay well under the cap below; a sustained burst that outruns pump's
  # drain rate is the failure mode a `used_memory` alert (WP20) needs to catch before Redis starts
  # rejecting writes. Do NOT "fix" this back to `allkeys-lru` to make that alert unnecessary — that
  # reintroduces the original bug (S4(c) is why isolation instead of noeviction isn't on the table).
  redis:
    image: redis:7-alpine
    container_name: open-gateway-redis
    logging: *default-logging
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    ports:
      # Loopback only: Redis has no password and holds gateway keys + analytics.
      - "127.0.0.1:33003:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - open-gateway-network

  # ─── Tyk gateway volume owner (one-shot) ───────────────
  # v5.15.0 is distroless and runs as uid 65532, but /opt/tyk-gateway/apps ships as root:root 0755,
  # so `POST /tyk/apis` fails with "file object creation failed, write error" until the volume is
  # chowned. Runs to completion before the gateway starts.
  #
  # The `.keep` file is what makes the chown stick: Docker copies the image's directory content into a
  # volume only while that volume is EMPTY, so chowning an empty volume was immediately undone by
  # root-owned app_sample.json landing on top of it on a fresh machine. Verified on v5.15.0:
  # chown-only -> /apps back to 0:0 and uid 65532 gets EACCES; chown + .keep -> stays 65532, writable.
  tyk-gateway-init:
    image: alpine:3
    container_name: open-gateway-tyk-init
    logging: *default-logging
    command: ["sh", "-c", "for d in /apps /policies; do chown -R 65532:65532 $$d && chmod 0755 $$d && touch $$d/.keep && chown 65532:65532 $$d/.keep; done"]
    volumes:
      - tyk_apps:/apps
      - tyk_policies:/policies
    networks:
      - open-gateway-network

  # ─── Tyk OSS Gateway ───────────────────────────────────
  # API definitions are stored as files in /opt/tyk-gateway/apps (volume survives recreation).
  tyk-gateway:
    image: tykio/tyk-gateway:v5.15.0
    container_name: open-gateway-tyk-gateway
    logging: *default-logging
    restart: unless-stopped
    environment:
      <<: *tyk-gateway-env
    expose:
      # Data plane only, and reachable only through the edge (WP26b) — 33005 is now the edge's
      # HTTPS listener, not this container's. 8081 (control API) stays inside the network either way.
      - "8080"
    ports:
      # WP27: the ONE deliberate exception to "only the edge publishes" (WP26b's own rule, restated
      # above). A TCP-protocol API def (`ApiProtocol.TCP`) is raw L4 passthrough — an HTTP-only
      # Coraza build cannot inspect it at all, so it CANNOT go through the edge the way every HTTP
      # api does; it has to bind its own published port straight from this container. `6000` is the
      # one demo/test port this WP wires (`ApiDefinition.listenPort`); Tyk opens the actual listener
      # itself the moment a `protocol:"tcp"` def with this port loads (confirmed against the v5.15.0
      # source, gated by TYK_GW_DISABLEPORTWHITELIST above) — this mapping does not create the
      # listener, it only has to agree with whatever port that definition uses.
      - "33020:6000"
    volumes:
      - tyk_apps:/opt/tyk-gateway/apps
      - tyk_policies:/opt/tyk-gateway/policies
    depends_on:
      redis:
        condition: service_healthy
      tyk-gateway-init:
        condition: service_completed_successfully
    # No healthcheck: the image is distroless — no shell, no wget, no curl. Dependents use
    # service_started; the API degrades gracefully (circuit breaker + syncStatus=FAILED + retry).
    networks:
      - open-gateway-network

  # ─── Multi-node gateways (profile: multinode) ──────────
  # `docker compose --profile multinode up -d` starts THREE gateways against the one Redis; the
  # default profile-less `up` starts exactly one and nothing below is created.
  #
  # Each node gets its OWN apps/policies volumes, which is the point rather than an oversight:
  # definitions and policies are file-backed per node (TYK_GW_USEDBAPPCONFIGS=false,
  # POLICIES_POLICYSOURCE=file), so a write has to reach every node. That is what TykClientService's
  # fan-out does, and what makes a hand-edit on one node show up as drift. Keys, quotas and
  # certificates are NOT duplicated — they live in the shared Redis (spike S7 measured certs as
  # Redis-shared), so they need no fan-out at all.
  #
  # `expose:` only, never `ports:`. The edge (WP26b) is the single published surface; a LAN client
  # able to reach a gateway directly would forge X-Forwarded-For and defeat the per-client limits.
  # The edge keeps pointing at `tyk-gateway` alone until WP29a gives it the full upstream set.
  #
  # To actually USE the extra nodes, set TYK_ADMIN_URLS in infra/.env to all three control APIs:
  #   TYK_ADMIN_URLS=http://tyk-gateway:8081/tyk,http://tyk-gateway-2:8081/tyk,http://tyk-gateway-3:8081/tyk
  # Left unset, the API talks to `tyk-gateway` only and the extra nodes sit idle and drift — the
  # node list is configuration, deliberately not discovered (Axis C / A1).
  tyk-gateway-multinode-init:
    image: alpine:3
    container_name: open-gateway-tyk-init-multinode
    logging: *default-logging
    profiles: ["multinode"]
    # Same chown + `.keep` dance as tyk-gateway-init, for the extra nodes' volumes — see the comment
    # there for why the `.keep` file is what makes the chown survive first boot.
    command: ["sh", "-c", "for d in /apps2 /policies2 /apps3 /policies3; do chown -R 65532:65532 $$d && chmod 0755 $$d && touch $$d/.keep && chown 65532:65532 $$d/.keep; done"]
    volumes:
      - tyk_apps_2:/apps2
      - tyk_policies_2:/policies2
      - tyk_apps_3:/apps3
      - tyk_policies_3:/policies3
    networks:
      - open-gateway-network

  tyk-gateway-2:
    image: tykio/tyk-gateway:v5.15.0
    container_name: open-gateway-tyk-gateway-2
    logging: *default-logging
    profiles: ["multinode"]
    restart: unless-stopped
    environment:
      <<: *tyk-gateway-env
    expose:
      - "8080"
    volumes:
      - tyk_apps_2:/opt/tyk-gateway/apps
      - tyk_policies_2:/opt/tyk-gateway/policies
    depends_on:
      redis:
        condition: service_healthy
      tyk-gateway-multinode-init:
        condition: service_completed_successfully
    networks:
      - open-gateway-network

  tyk-gateway-3:
    image: tykio/tyk-gateway:v5.15.0
    container_name: open-gateway-tyk-gateway-3
    logging: *default-logging
    profiles: ["multinode"]
    restart: unless-stopped
    environment:
      <<: *tyk-gateway-env
    expose:
      - "8080"
    volumes:
      - tyk_apps_3:/opt/tyk-gateway/apps
      - tyk_policies_3:/opt/tyk-gateway/policies
    depends_on:
      redis:
        condition: service_healthy
      tyk-gateway-multinode-init:
        condition: service_completed_successfully
    networks:
      - open-gateway-network

  # ─── Tyk Pump (analytics → Postgres) ───────────────────
  tyk-pump:
    image: tykio/tyk-pump-docker-pub:v1.17.0
    container_name: open-gateway-tyk-pump
    logging: *default-logging
    restart: unless-stopped
    environment:
      # Overrides pump.conf's connection_string (which carries no real password) with the actual
      # DB_PASS. Verified working: TYK_PMP_PUMPS_<NAME>_META_CONNECTIONSTRING, <NAME> = the pump.conf
      # key uppercased with NO underscore (see docs/ANALYTICS-PIPELINE.md) — "postgres"/"postgresaggregate"
      # both qualify.
      TYK_PMP_PUMPS_POSTGRES_META_CONNECTIONSTRING: "host=postgres port=5432 user=opengateway password=${DB_PASS:?set DB_PASS (install.sh generates infra/.env; or openssl rand -hex 16)} dbname=opengateway sslmode=disable"
      TYK_PMP_PUMPS_POSTGRESAGGREGATE_META_CONNECTIONSTRING: "host=postgres port=5432 user=opengateway password=${DB_PASS:?set DB_PASS (install.sh generates infra/.env; or openssl rand -hex 16)} dbname=opengateway sslmode=disable"
    volumes:
      - ./pump/pump.conf:/opt/tyk-pump/pump.conf:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # No compose healthcheck — distroless image (no shell/curl to run one). The pump's own
    # /health endpoint (pump.conf: health_check_endpoint_*, port 8083) is not published to the host;
    # the API probes it over this network via PUMP_HEALTH_URL to report "pump not running", and the
    # sidecar below gives `docker compose ps`/`up --wait` a real container-level health signal too.
    networks:
      - open-gateway-network

  # ─── Gateway + Pump healthcheck sidecar ────────────────
  # Both tyk-gateway and tyk-pump are distroless (no shell, no curl/wget), so neither can run a
  # `HEALTHCHECK` of its own — the reason both were healthcheck-less until now. This sidecar has no
  # job beyond polling their in-network health endpoints (neither is published to the host) and
  # surfacing the result as its own compose health state.
  tyk-healthcheck:
    image: curlimages/curl:8.15.0
    container_name: open-gateway-tyk-healthcheck
    logging: *default-logging
    entrypoint: ["sh", "-c", "sleep infinity"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://tyk-gateway:8081/hello && curl -sf http://tyk-pump:8083/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      - tyk-gateway
      - tyk-pump
    networks:
      - open-gateway-network

  # ─── Edge healthcheck sidecar (WP29a) ──────────────────
  # The edge already HAS a healthcheck (`wget http://127.0.0.1:2019/...`, in-container, against
  # Caddy's admin API). This sidecar is not a duplicate of it, and the difference is the whole
  # reason it exists: the admin-API probe proves the PROCESS is alive and holds a config, and it
  # structurally cannot prove that a TLS handshake succeeds — because Caddy's `tls internal` issues
  # its 12-hour leaves lazily, AT handshake time. If issuance or renewal breaks, the admin API keeps
  # answering 200 on 2019 while every real request fails. That is R14's silent-failure mode exactly,
  # and the in-container check reports healthy right through it.
  #
  # So: a real HTTPS request, from OUTSIDE the container, over the network path a client uses. Same
  # curl-sidecar pattern as tyk-healthcheck above (for a different reason — there the images are
  # distroless; here the check has to originate off-box).
  #
  #   --connect-to  keeps SNI and Host as `localhost` (what the certificate is issued for) while
  #                 dialling the container name. Without it the probe fails on a hostname mismatch,
  #                 which would look exactly like the outage it is supposed to detect.
  #   /api/metrics  is answered 404 by the EDGE itself (`respond /api/metrics* 404` in the
  #                 Caddyfile), so this measures the edge and never the API behind it. curl exits 0
  #                 on a 404 — TLS, routing and the response are all proven without `-f` turning an
  #                 upstream's health into the edge's.
  #   --cacert      when the root has been exported (infra/edge/README.md), so an EXPIRED leaf fails
  #                 the probe too; `-k` otherwise, which still catches a handshake that dies
  #                 outright. A fresh install has no root.crt and must not be born unhealthy.
  edge-healthcheck:
    image: curlimages/curl:8.15.0
    container_name: open-gateway-edge-healthcheck
    logging: *default-logging
    entrypoint: ["sh", "-c", "sleep infinity"]
    volumes:
      - ./edge:/edge:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if [ -r /edge/root.crt ]; then CA="--cacert /edge/root.crt"; else CA="-k"; fi;
          curl -sS -o /dev/null $$CA --connect-to localhost:33001:edge:33001
          https://localhost:33001/api/metrics
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      - edge
    networks:
      - open-gateway-network

  # ─── OpenTelemetry Collector (WP20) ────────────────────
  # Traces in from the edge, the gateway and the API; WAF detections in from the edge's log file and
  # out as a Prometheus counter. Config and reasoning: observability/otel-collector.yaml.
  #
  # `expose:` only, like everything else since WP26b. Nothing outside this network should be able to
  # post spans into it, and it is not routed through the edge.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.121.0
    container_name: open-gateway-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    expose:
      - "4317"
      - "4318"
      - "8889"
      # OG-OBS-01: the collector's own telemetry, scraped as `otel-collector-self`.
      - "8888"
    volumes:
      - ../observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
      # Read-only: the collector tails the edge's WAF log, it never writes there.
      - edge_logs:/var/log/caddy:ro
    # Traces go to this container's stdout (`debug` exporter, verbosity detailed) because there is
    # no trace backend yet — Grafana/Tempo are cut, §9. Read them with
    # `docker logs open-gateway-otel-collector | grep <trace id>`. The cap is what makes that safe:
    # detailed span output on an unbounded json-file driver is a disk-filling accident waiting to
    # happen, and this is the whole reason a file-on-a-volume sink was not used instead (see
    # observability/otel-collector.yaml). This service had its own 3 × 32 MB cap before OG-OBS-01;
    # it now uses the shared anchor like everything else, because here the log IS the trace store and
    # 250 MB of it is more trace history, not a risk — one cap, no exception to keep in sync.
    logging: *default-logging
    networks:
      - open-gateway-network

  # ─── Prometheus (WP20) ─────────────────────────────────
  # Scrape config in observability/prometheus.yml, alert rules in observability/rules/.
  # Unpublished on purpose — §6's curl container is how it is queried, same as the Tyk control API.
  # There is no Alertmanager and no Grafana (§9): "the alert fires" is read off
  # `ALERTS{alertstate="firing"}` through the query API.
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: open-gateway-prometheus
    logging: *default-logging
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 15d of a dev stack's series is well under a gigabyte and outlives any incident here.
      - --storage.tsdb.retention.time=15d
      # OG-OBS-01: a size ceiling as well, whichever is hit first. The exporters below multiply the
      # series count, and time-only retention lets a cardinality accident fill the host disk.
      - --storage.tsdb.retention.size=${PROM_RETENTION_SIZE:-4GB}
    expose:
      - "9090"
    # OG-OBS-01 (C6): node-exporter lives in the HOST network namespace, bound to the docker0
    # gateway only; `host-gateway` resolves to that same address, so the scrape target is
    # `host.docker.internal:9100` without hard-coding an IP in prometheus.yml. See node-exporter.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    healthcheck:
      # OG-OBS-01: the image is busybox-based, so it can probe itself. Until now a wedged Prometheus
      # looked exactly like a healthy one to `docker compose ps` — and nothing else watches it.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      - otel-collector
    networks:
      - open-gateway-network

  # ─── Host metrics: node-exporter (OG-OBS-01) ───────────
  # ADR-OBS-01 in docs/ha-observability/04 §5; placement per 01 §6.
  #
  # HOST network namespace, because NIC metrics are per-netns: in a bridge network node-exporter
  # sees only its own eth0 and lo (lab-verified), never the host's real interfaces. The price is that
  # this is the one service whose listener is NOT behind compose networking, so it is bound to the
  # docker0 gateway address and nothing else (C6, lab-verified):
  #   - Prometheus reaches it as `host.docker.internal:9100` (its extra_hosts entry resolves
  #     `host-gateway` to that same address);
  #   - the host's LAN, loopback and VPN addresses refuse :9100 — binding 0.0.0.0 would have put
  #     host metrics on the LAN, since Fedora Workstation's default firewalld zone opens every
  #     port above 1024;
  #   - residual, documented rather than hidden: any container on this host can reach the docker0
  #     address (raw-IP, so the proxyUrl hostname denylist cannot catch it), and a LAN peer on the
  #     same L2 that routes 172.17.0.0/16 via this host could too. Cross-host (scenario B) needs the
  #     management IP plus TLS/basic auth and a host firewall rule, per 01 §6.
  # A daemon with a non-default `bip` moves docker0: set NODE_EXPORTER_LISTEN_ADDRESS to match.
  # Getting it wrong fails loudly — the scrape goes `up == 0` — never silently.
  #
  # `$$` is compose's escape for a literal `$` (regex end anchor), not a typo.
  #
  # Image pins for all six OG-OBS services (node-exporter … redis-exporter): tag@digest, resolved
  # 2026-09-27 with `docker buildx imagetools inspect <image>:<tag> --format '{{.Manifest.Digest}}'`
  # (the multi-arch index digest). The digest is what gets pulled; the tag is there for the reader.
  # To bump one, resolve the new tag the same way and replace both halves together.
  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    container_name: open-gateway-node-exporter
    logging: *default-logging
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --path.udev.data=/host/run/udev/data
      - --web.listen-address=${NODE_EXPORTER_LISTEN_ADDRESS:-172.17.0.1:9100}
      # Cardinality (02 §5): no per-layer overlay mounts, no per-container veth devices.
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|run|sys|var/lib/docker/.+|var/lib/containers/.+)($$|/)
      - --collector.netdev.device-exclude=^(veth.*|br-.*|docker0|lo)$$
      # C5: backup / restore-drill / deploy markers, written by the scripts into og_textfile.
      - --collector.textfile.directory=/textfile
    volumes:
      - /:/host:ro,rslave
      - og_textfile:/textfile:ro

  # ─── Container metrics: cAdvisor (OG-OBS-01) ───────────
  # ADR-OBS-01 in docs/ha-observability/04 §5. Mounts are the official Prometheus cAdvisor guide's.
  # Not privileged, but not unprivileged either, and each grant was lab-proven necessary:
  #   - `/var/run` rw contains docker.sock, which is ROOT-EQUIVALENT on this host (R-OBS-01): anything
  #     that compromises this container owns the host. It is REQUIRED — without it the docker
  #     factory never registers and there is not one `name="open-gateway-*"` series (lab: 0 vs 16).
  #     `:ro` would not help — a read-only mount does not stop connect() on a unix socket.
  #   - `/dev/kmsg` + CAP_SYSLOG is the only OOM source cAdvisor has. Without the device it logs
  #     "disabling OOM events" and container_oom_events_total stays 0 through a real OOM kill; with
  #     the device but no cap it fails the same way on hosts with kernel.dmesg_restrict=1 (Fedora's
  #     default). Cost: it can read the kernel ring buffer.
  # Expose-only (it serves a read-only UI and API on 8080 alongside /metrics).
  #
  # Cardinality: cAdvisor turns every container label into a Prometheus label by default (51 label
  # names measured here, compose config hashes included), so only the compose project and service
  # labels are kept. `--disable_metrics` keeps only cpu, memory, oom_event, network, disk and diskIO:
  # 71 series per container vs 84 at cAdvisor's default and 230 unfiltered, measured on v0.60.6
  # (.omc/research/ha-observability/F-lab-names.md §3).
  cadvisor:
    # ghcr.io, not gcr.io: the gcr.io repository stopped publishing at v0.55.1.
    image: ghcr.io/google/cadvisor:v0.60.6@sha256:b8e7d1093144fd088f425ff003d75a4aa405de075db78dae3bc563730b1bd07a
    container_name: open-gateway-cadvisor
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]  # review L1: no setuid/file-cap escalation; lab-verified
    restart: unless-stopped
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
      - --disable_metrics=advtcp,app,cpuLoad,cpu_topology,cpuset,hugetlb,memory_numa,percpu,perf_event,pressure,process,referenced_memory,resctrl,sched,tcp,udp
    devices:
      - /dev/kmsg
    cap_add:
      - SYSLOG
    # 01 §6: resource-capped, because it walks every cgroup on the host every 15 s. Measured ~30 MiB
    # on a 45-container lab host; 04 §4 budgets 100–200 MB, so this leaves headroom over the budget.
    # Raise it if cAdvisor restarts with `docker inspect … {{.State.OOMKilled}}` = true — it cannot
    # report its own OOM, and a gap in every container_* series is what that looks like.
    mem_limit: 256m
    cpus: 0.5
    expose:
      - "8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - open-gateway-network

  # ─── Synthetic probes: internal blackbox (OG-OBS-02) ───
  # ADR-OBS-02 in docs/ha-observability/04 §5. Outbound probes only, no secrets; modules in
  # observability/blackbox.yml. The edge's exported root CA comes in as the `./edge` DIRECTORY, not
  # the `root.crt` file, for the reason the api service spells out: that file is git-ignored and
  # per-install, and a file bind-mount of a missing path makes Docker create a root-owned DIRECTORY
  # at infra/edge/root.crt — which then breaks the README's export step and edge-healthcheck.
  blackbox:
    image: prom/blackbox-exporter:v0.28.0@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc
    container_name: open-gateway-blackbox
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]  # review L1: no setuid/file-cap escalation; lab-verified
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    expose:
      - "9115"
    volumes:
      - ../observability/blackbox.yml:/etc/blackbox/blackbox.yml:ro
      - ./edge:/etc/blackbox/edge:ro
    networks:
      - open-gateway-network

  # ─── Postgres monitoring role (one-shot, OG-OBS-02) ────
  # Creates or updates `og_monitor` (LOGIN + pg_monitor, never superuser) from PG_EXPORTER_PASSWORD;
  # the SQL and why it cannot leak the password are in infra/postgres/monitoring-role.sql. A job
  # rather than docker-entrypoint-initdb.d for the reason ory-db-init gives: that directory only runs
  # on a fresh volume. Idempotent, and it re-applies the password on every `up`, so rotating the
  # value in infra/.env is one `up` rather than a manual ALTER ROLE.
  #
  # PG_EXPORTER_PASSWORD is soft (`:-`) in this file and FAILS CLOSED here instead (lead decision,
  # OG-OBS-02 C1 amendment): a missing monitoring secret must not break `ps`/`logs`/`up` for the
  # whole stack, so compose accepts it empty and this job refuses it — exit 1, no role touched. It
  # then sits in `ps` as Exited (1), and postgres-exporter scrapes with pg_up 0 until the key exists.
  # The prod overlay puts the `:?` back.
  #
  # NOTHING may wait on this job with `service_completed_successfully` (live incident, 2026-09-27).
  # When an awaited dependency fails, compose stops SCHEDULING every service it has not reached yet:
  # with postgres-exporter gated on this job, a missing key left hydra, kratos, keto, edge, api and
  # web in `Created`, because they sit behind the slower ory-db-init -> *-migrate chain. A monitoring
  # one-shot must never be able to hold the application's start hostage; see postgres-exporter.
  pg-monitoring-init:
    image: postgres:16-alpine
    container_name: open-gateway-pg-monitoring-init
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]  # review L1: no setuid/file-cap escalation; lab-verified
    command:
      - sh
      - -c
      - >-
        if [ "$${#PG_EXPORTER_PASSWORD}" -lt 32 ]; then
        echo "PG_EXPORTER_PASSWORD unset or shorter than 32 characters — run install.sh (or add it to infra/.env)" >&2;
        exit 1; fi;
        exec psql -v ON_ERROR_STOP=1 -f /monitoring-role.sql
    environment:
      PGHOST: postgres
      PGUSER: opengateway
      PGPASSWORD: ${DB_PASS:?set DB_PASS (install.sh generates infra/.env; or openssl rand -hex 16)}
      PGDATABASE: opengateway
      PG_EXPORTER_PASSWORD: ${PG_EXPORTER_PASSWORD:-}
    volumes:
      - ./postgres/monitoring-role.sql:/monitoring-role.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - open-gateway-network

  # ─── Postgres metrics (OG-OBS-02) ──────────────────────
  # docs/ha-observability/01 §6. Logs in as og_monitor (pg_monitor only), NOT as the opengateway
  # superuser every other client uses — an exporter is exactly the kind of long-lived, always-on
  # credential that should be able to read statistics and nothing else. User and password are split
  # out of the DSN so the password never sits inside a URL. Its multi-target `/probe` has no off
  # switch in v0.20.1 but does not reuse these credentials (review M2, lab-verified; file header).
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    container_name: open-gateway-postgres-exporter
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]  # review L1: no setuid/file-cap escalation; lab-verified
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: postgres:5432/opengateway?sslmode=disable
      DATA_SOURCE_USER: og_monitor
      # Soft on purpose — see pg-monitoring-init, which refuses an empty one.
      DATA_SOURCE_PASS: ${PG_EXPORTER_PASSWORD:-}
    expose:
      - "9187"
    # `service_started`, NOT `service_completed_successfully`, on the init job — see the incident note
    # there. It keeps the ordering (and `up postgres-exporter` pulls the job in) without making the
    # job's exit code a gate: the exporter connects per scrape, so a role that lands a few seconds
    # later is simply picked up, and a role that never lands shows as pg_up 0 rather than a stuck stack.
    depends_on:
      postgres:
        condition: service_healthy
      pg-monitoring-init:
        condition: service_started
    networks:
      - open-gateway-network

  # ─── Redis metrics (OG-OBS-02) ─────────────────────────
  # docs/ha-observability/01 §6. `--check-keys` is limited to the analytics buffer (`analytics-*`,
  # the list tyk-pump drains): its length is the pump-backlog signal, and a wider pattern would SCAN
  # and export every gateway key. The prod overlay adds REDIS_PASSWORD.
  #
  # The two `--disable-*` flags are security fixes (review H1), not tuning. Without them, anything
  # that reaches this container by raw IP — a tenant proxyUrl through the gateway included — could
  # call `/scrape?target=redis:6379&check-keys=apikey-*` and have the exporter read arbitrary keys
  # with ITS stored REDIS_PASSWORD, key values exported as labels. `--disable-scrape-endpoint`
  # removes /scrape (404); `--disable-exporting-key-values` keeps even the analytics keys to
  # size/length, never content. `/metrics` takes no per-request key parameters (lab-verified).
  redis-exporter:
    image: oliver006/redis_exporter:v1.92.0@sha256:ca3abd5f19da6c87e96038ba08aaa3dfaab34dc649834584c4d6880b05952fef
    container_name: open-gateway-redis-exporter
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]  # review L1: no setuid/file-cap escalation; lab-verified
    restart: unless-stopped
    command: ["--check-keys=analytics-*", "--disable-scrape-endpoint", "--disable-exporting-key-values"]
    environment:
      REDIS_ADDR: redis:6379
    expose:
      - "9121"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - open-gateway-network

  # ─── NestJS API ────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: open-gateway-api
    logging: *default-logging
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://opengateway:${DB_PASS:?set DB_PASS (install.sh generates infra/.env; or openssl rand -hex 16)}@postgres:5432/opengateway?schema=public
      REDIS_URL: redis://redis:6379
      # No default on purpose: a committed JWT secret means every stack signs tokens with a key that
      # is public. install.sh writes one into infra/.env; `export JWT_SECRET=...` also works.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (install.sh generates infra/.env; or openssl rand -hex 32)}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      # WP27: checked by webhook-relay.controller.ts against the header Tyk's own event handler
      # config carries (webhook-relay.constants.ts embeds it there, read from this same var). No
      # default, same reasoning as JWT_SECRET above: that relay endpoint is `@Public()` and, being
      # served by this same process, is reachable through the edge's published API port too, not
      # only from Tyk inside the network — a checked-in default would let anyone who read this file
      # forge a webhook event for any tenant's API.
      TYK_WEBHOOK_RELAY_SECRET: ${TYK_WEBHOOK_RELAY_SECRET:?set TYK_WEBHOOK_RELAY_SECRET (install.sh generates infra/.env; or openssl rand -hex 32)}
      # Ory. In-network URLs for every call the API makes; the ISSUER is the browser-facing one
      # because that is the `iss` Hydra stamps into a token (urls.self.issuer in hydra.yml), and
      # JwtStrategy verifies the claim against it while fetching JWKS from the in-network host.
      ORY_HYDRA_PUBLIC_URL: http://hydra:4444
      ORY_HYDRA_ADMIN_URL: http://hydra:4445
      ORY_HYDRA_ISSUER: https://localhost:33010/
      ORY_KRATOS_PUBLIC_URL: http://kratos:4433
      ORY_KRATOS_ADMIN_URL: http://kratos:4434
      # Keto answers tenant membership (read 4466 = check, write 4467 = tuples).
      ORY_KETO_READ_URL: http://keto:4466
      ORY_KETO_WRITE_URL: http://keto:4467
      CORS_ORIGINS: https://localhost:33000
      # WP26b: the edge is now the only publisher and there is exactly one proxy hop in front of this
      # container, so both of these flipped from their old "no TLS" defaults. TRUST_PROXY_HOPS is a
      # COUNT, never `true` — `0` made main.ts ignore X-Forwarded-For entirely, which behind the edge
      # collapses every per-IP rate limit into one bucket keyed on the edge's own address. `1` makes
      # req.ip the last XFF entry, which the Caddyfile guarantees is the real client (it REPLACES the
      # header with {remote_host} rather than appending to whatever the client sent).
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      # Control API port (see TYK_GW_CONTROLAPIPORT above), reachable only inside this network.
      TYK_ADMIN_URL: http://tyk-gateway:8081/tyk
      # Every gateway node's control API, comma separated, each WITH the /tyk suffix (WP13a).
      # Empty by default, and TykClientService then falls back to TYK_ADMIN_URL above — so a
      # single-node stack behaves exactly as it did. Set it in infra/.env to fan out.
      TYK_ADMIN_URLS: ${TYK_ADMIN_URLS:-}
      TYK_ADMIN_SECRET: ${TYK_GW_SECRET:-tyk-gateway-secret}
      # /hello is served by the control API port too, so the health probe points at 8081.
      TYK_GATEWAY_URL: http://tyk-gateway:8081
      # TYK_ORG_ID is deliberately gone (WP12c). It was one org for every tenant, which made
      # `POST /tyk/org/keys {is_inactive:true}` an all-tenants kill switch and `/tyk/certs?org_id`
      # meaningless. The org is now per tenant (`Tenant.tykOrgId`, read via `loadTenantScope`); any
      # code reaching for this env var again is a regression — `grep -rn TYK_ORG_ID apps/api/src`
      # must stay empty.
      # Upstream hosts an API may never proxy to, on top of the built-in denylist (loopback,
      # link-local / metadata, the service names above). Comma separated.
      PROXY_DENY_HOSTS: ""
      # OAS-08: private hosts/CIDRs the API may fetch OpenAPI documents from (comma separated,
      # host[:port] or CIDR[:port]). Empty = public hosts only. Installation-wide: every tenant can reach
      # every listed host. See docs/OAS-SPEC-FETCH.md.
      SPEC_FETCH_ALLOWED_HOSTS: ${SPEC_FETCH_ALLOWED_HOSTS:-}
      # Pump liveness probe for GET /api/analytics/health (unset = reported as not running)
      PUMP_HEALTH_URL: http://tyk-pump:8083/health
      # WP20 — tracing is OFF unless this is set (apps/api/src/tracing.ts), so tests and a bare
      # `pnpm dev` need no collector. HTTP/protobuf rather than gRPC to keep a native dependency out
      # of the alpine image; the collector listens on both.
      OTEL_SERVICE_NAME: open-gateway-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      # The edge's exported root CA, read on every /api/metrics scrape for the R14 expiry gauge.
      EDGE_ROOT_CERT_PATH: /etc/open-gateway/edge/root.crt
      # WP29a — the other half of R14. The root above is a FILE; the leaf (12 h) and intermediate
      # (7 d) are read off a TLS handshake with the edge on every scrape, because `tls internal`
      # issues and renews them lazily and only what is being SERVED proves renewal still works.
      # Unset, the leaf/intermediate series are simply absent (the root gauge is unaffected).
      EDGE_TLS_PROBE: ${EDGE_TLS_PROBE:-edge:33001}
    expose:
      - "4000"
    volumes:
      # The DIRECTORY, not the file. `infra/edge/root.crt` is git-ignored and produced per install
      # (`docker compose cp edge:/data/caddy/pki/authorities/local/root.crt`, see
      # infra/edge/README.md), and a bind mount of a path that does not exist yet would have Docker
      # create an empty DIRECTORY there. Mounting `./edge` — which is always present — turns "not
      # exported yet" into a plain ENOENT, so the gauge is simply absent instead of the container
      # coming up around a phantom directory.
      #
      # Read-only, and only ever the public certificate: never the `caddy_data` volume, which holds
      # the CA's PRIVATE key next to it. That file is the artifact clients are told to install, so
      # alerting on its expiry alerts on exactly what they trust.
      #
      # It has to be world-readable — `docker compose cp` preserves Caddy's 0600 and this container
      # runs as uid 1001, so the README's export step ends with `chmod 644`.
      - ./edge:/etc/open-gateway/edge:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      tyk-gateway:
        condition: service_started
      # Every authenticated request needs both: Hydra's JWKS to verify the token, Keto to confirm
      # the caller's tenant membership. Booting ahead of them means 500s until they catch up.
      hydra:
        condition: service_healthy
      keto:
        condition: service_healthy
      # The API doesn't call Kratos directly today, but it's part of the same auth cutover — wait
      # for it too rather than relying on restart: unless-stopped to paper over a startup race.
      kratos:
        condition: service_started
    networks:
      - open-gateway-network
      - ory-internal

  # ─── Next.js Web ───────────────────────────────────────
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      # NEXT_PUBLIC_* is inlined at build time (see the Dockerfile), so it must be repeated here as a
      # build arg, not only below as a runtime var. Keep both in sync.
      args:
        NEXT_PUBLIC_API_URL: https://localhost:33001/api
        NEXT_PUBLIC_KRATOS_URL: https://localhost:33012
        NEXT_PUBLIC_HYDRA_URL: https://localhost:33010
        NEXT_PUBLIC_APP_URL: https://localhost:33000
        NEXT_PUBLIC_GATEWAY_URL: https://localhost:33005
        # From infra/.env (single-quote the JSON there); empty = the map shows no pins.
        NEXT_PUBLIC_GATEWAY_NODE_LOCATIONS: ${NEXT_PUBLIC_GATEWAY_NODE_LOCATIONS:-}
    container_name: open-gateway-web
    logging: *default-logging
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: https://localhost:33001/api
      # The app's own public origin — read server-side only (hydra-admin.ts), so it's a plain
      # runtime var, not NEXT_PUBLIC_*. Load-bearing for the open-redirect fix's origin check
      # (sanitizeReturnTo): a deployment to a different origin that forgets this falls back to
      # localhost:33000 and silently flattens every return_to to '/' instead of erroring.
      APP_URL: https://localhost:33000
      # Browser-facing — the browser talks to Kratos/Hydra directly, same as it does the API above.
      NEXT_PUBLIC_KRATOS_URL: https://localhost:33012
      NEXT_PUBLIC_HYDRA_URL: https://localhost:33010
      # WP23: the gateway's own data-plane port — the portal's try-it console calls it directly
      # from the browser with the developer's own key.
      NEXT_PUBLIC_GATEWAY_URL: https://localhost:33005
      # This container's OWN outbound calls (login-challenge handling, token exchange) — in-network,
      # unlike the NEXT_PUBLIC_* pair above. Hydra admin is loopback-only on the host but reachable
      # here at hydra:4445 because this container shares hydra/kratos's compose network.
      HYDRA_PUBLIC_URL: http://hydra:4444
      HYDRA_ADMIN_URL: http://hydra:4445
      KRATOS_INTERNAL_URL: http://kratos:4433
      # This app talks to Postgres directly in one place: /oauth2/login provisions the local `User`
      # row for a Kratos identity (the row whose id becomes the Hydra token subject). Without this
      # the whole login flow 500s on `Environment variable not found: DATABASE_URL`.
      DATABASE_URL: postgresql://opengateway:${DB_PASS:?set DB_PASS (install.sh generates infra/.env; or openssl rand -hex 16)}@postgres:5432/opengateway?schema=public
    expose:
      - "3000"
    depends_on:
      - api
    networks:
      - open-gateway-network
      - ory-internal

  # ─── Ory database bootstrap (one-shot) ─────────────────
  # Hydra/Kratos/Keto each get their own database in the existing postgres container, kept apart
  # from the `opengateway` app database. This is a job rather than a docker-entrypoint-initdb.d
  # script because that directory only runs when the postgres volume is first initialised — which
  # already happened on every existing install. init-db.sql is idempotent, so it is safe every boot.
  ory-db-init:
    image: postgres:16-alpine
    container_name: open-gateway-ory-db-init
    logging: *default-logging
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/init-db.sql"]
    environment:
      PGHOST: postgres
      PGUSER: opengateway
      PGPASSWORD: ${DB_PASS:?set DB_PASS (install.sh generates infra/.env; or openssl rand -hex 16)}
      PGDATABASE: opengateway
    volumes:
      - ./ory/init-db.sql:/init-db.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ory-internal

  # ─── Ory Hydra (OAuth2/OIDC) ───────────────────────────
  # Hydra holds no users: it redirects to the login/consent app (urls.* in hydra.yml, built by WP3)
  # and issues JWT access tokens that Tyk validates offline against /.well-known/jwks.json.
  hydra-migrate:
    image: oryd/hydra:v26.2.0
    container_name: open-gateway-hydra-migrate
    logging: *default-logging
    command: migrate sql -e --yes
    environment:
      DSN: postgres://opengateway:${DB_PASS:?set DB_PASS (install.sh generates infra/.env; or openssl rand -hex 16)}@postgres:5432/hydra?sslmode=disable
    depends_on:
      ory-db-init:
        condition: service_completed_successfully
    networks:
      - ory-internal

  hydra:
    image: oryd/hydra:v26.2.0
    container_name: open-gateway-hydra
    logging: *default-logging
    restart: unless-stopped
    # WP26b dropped `--dev`: the edge terminates TLS, so the issuer is https and Hydra no longer
    # needs the plain-HTTP escape hatch. Without --dev Hydra refuses any request that did not arrive
    # over TLS unless the terminating proxy's address is whitelisted — that is
    # `serve.tls.allow_termination_from` in hydra.yml, and the two changes only work together.
    command: serve all -c /etc/config/hydra.yml
    environment:
      DSN: postgres://opengateway:${DB_PASS:?set DB_PASS (install.sh generates infra/.env; or openssl rand -hex 16)}@postgres:5432/hydra?sslmode=disable
      SECRETS_SYSTEM: ${HYDRA_SECRETS_SYSTEM:?set HYDRA_SECRETS_SYSTEM (install.sh generates infra/.env; or openssl rand -hex 32)}
      SECRETS_COOKIE: ${HYDRA_SECRETS_COOKIE:?set HYDRA_SECRETS_COOKIE (install.sh generates infra/.env; or openssl rand -hex 32)}
    volumes:
      - ./ory/hydra/hydra.yml:/etc/config/hydra.yml:ro
    expose:
      # Public OAuth2 endpoints — published as https://localhost:33010 by the edge (WP26b).
      - "4444"
    ports:
      # Admin API: UNAUTHENTICATED (client CRUD, consent grants). Loopback only, like postgres/redis,
      # and deliberately NOT routed through the edge — a site for it would put an unauthenticated
      # admin API on the LAN.
      - "127.0.0.1:33011:4445"
    healthcheck:
      # Unlike the Tyk image, the non-distroless Ory images ship busybox wget.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4445/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully
    networks:
      - ory-internal

  # ─── Ory Kratos (identity / self-service) ──────────────
  # Headless: it returns flow state as JSON and renders nothing. WP3 builds every screen.
  kratos-migrate:
    image: oryd/kratos:v26.2.0
    container_name: open-gateway-kratos-migrate
    logging: *default-logging
    command: migrate sql -e --yes
    environment:
      DSN: postgres://opengateway:${DB_PASS:?set DB_PASS (install.sh generates infra/.env; or openssl rand -hex 16)}@postgres:5432/kratos?sslmode=disable
    depends_on:
      ory-db-init:
        condition: service_completed_successfully
    networks:
      - ory-internal

  # ─── Mail catcher (WP22) ────────────────────────────────
  # Kratos's courier needs a real SMTP endpoint or every recovery/verification send silently fails
  # against the placeholder URI (kratos.yml's own courier.smtp comment). Mailpit is that endpoint for
  # this stack: a genuine SMTP server (1025) that holds what it receives and exposes it over HTTP
  # (8025) instead of forwarding anywhere — which is what lets an integration run assert a
  # verification email actually arrived, with no internet-connected mail provider needed. Point
  # KRATOS_SMTP_URI (infra/.env) at a real external SMTP server instead for an install that needs
  # mail to actually leave the stack; this container is not built for that.
  mailpit:
    image: axllent/mailpit:v1.21.3
    container_name: open-gateway-mailpit
    logging: *default-logging
    restart: unless-stopped
    expose:
      - "1025"
    ports:
      # HTTP API/UI: loopback only, like every other admin surface in this stack.
      - "127.0.0.1:33016:8025"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8025/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - ory-internal

  kratos:
    image: oryd/kratos:v26.2.0
    container_name: open-gateway-kratos
    logging: *default-logging
    restart: unless-stopped
    # WP22: --watch-courier runs the courier's SMTP dispatch loop in-process. Without it, a
    # recovery/verification code is queued (courier_messages) and never actually sent — live-verified:
    # the self-service flow answered `sent_email` and nothing reached Mailpit until this flag was added.
    command: serve all --dev --watch-courier -c /etc/config/kratos/kratos.yml
    environment:
      DSN: postgres://opengateway:${DB_PASS:?set DB_PASS (install.sh generates infra/.env; or openssl rand -hex 16)}@postgres:5432/kratos?sslmode=disable
      SECRETS_DEFAULT: ${KRATOS_SECRETS_DEFAULT:?set KRATOS_SECRETS_DEFAULT (install.sh generates infra/.env; or openssl rand -hex 32)}
      SECRETS_COOKIE: ${KRATOS_SECRETS_COOKIE:?set KRATOS_SECRETS_COOKIE (install.sh generates infra/.env; or openssl rand -hex 32)}
      # Must be exactly 32 characters — Kratos refuses to start otherwise (openssl rand -hex 16).
      SECRETS_CIPHER: ${KRATOS_SECRETS_CIPHER:?set KRATOS_SECRETS_CIPHER (install.sh generates infra/.env; or openssl rand -hex 16)}
      # WP22: real SMTP by default now — Mailpit, started above, actually receives what Kratos sends
      # rather than failing against the old placeholder. Override KRATOS_SMTP_URI in infra/.env to
      # point at a real external SMTP server for an install that needs mail to leave the stack.
      COURIER_SMTP_CONNECTION_URI: ${KRATOS_SMTP_URI:-smtp://mailpit:1025/?skip_ssl_verify=true&disable_starttls=true}
      SESSION_COOKIE_SECURE: ${KRATOS_COOKIE_SECURE:-false}
    volumes:
      - ./ory/kratos:/etc/config/kratos:ro
    expose:
      # Public self-service API — published as https://localhost:33012 by the edge (WP26b) and
      # called from the browser (CORS is configured in kratos.yml).
      - "4433"
    ports:
      # Admin API: UNAUTHENTICATED (identity CRUD, recovery links). Loopback only, and not routed
      # through the edge — its `admin.base_url` in kratos.yml stays plain HTTP on 33013 for that reason.
      - "127.0.0.1:33013:4434"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4434/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    networks:
      - ory-internal

  # ─── Ory Keto (relation-tuple authorization) ───────────
  keto-migrate:
    image: oryd/keto:v26.2.0
    container_name: open-gateway-keto-migrate
    logging: *default-logging
    command: migrate up --yes -c /etc/config/keto/keto.yml
    environment:
      DSN: postgres://opengateway:${DB_PASS:?set DB_PASS (install.sh generates infra/.env; or openssl rand -hex 16)}@postgres:5432/keto?sslmode=disable
    volumes:
      - ./ory/keto:/etc/config/keto:ro
    depends_on:
      ory-db-init:
        condition: service_completed_successfully
    networks:
      - ory-internal

  keto:
    image: oryd/keto:v26.2.0
    container_name: open-gateway-keto
    logging: *default-logging
    restart: unless-stopped
    command: serve -c /etc/config/keto/keto.yml
    environment:
      DSN: postgres://opengateway:${DB_PASS:?set DB_PASS (install.sh generates infra/.env; or openssl rand -hex 16)}@postgres:5432/keto?sslmode=disable
    volumes:
      - ./ory/keto:/etc/config/keto:ro
    ports:
      # Both APIs are UNAUTHENTICATED — loopback only. The API reaches them over this network at
      # http://keto:4466 (check/read) and http://keto:4467 (write).
      - "127.0.0.1:33014:4466"
      - "127.0.0.1:33015:4467"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4466/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      keto-migrate:
        condition: service_completed_successfully
    networks:
      - ory-internal

volumes:
  postgres_data:
    driver: local
  # WP29a: WAL segments (postgres writes, postgres-backup prunes) and base backups. Separate
  # volumes from postgres_data — see the postgres service.
  pg_wal_archive:
    driver: local
  pg_backups:
    driver: local
  redis_data:
    driver: local
  tyk_apps:
    driver: local
  tyk_policies:
  # multinode profile only: one apps/policies pair per extra node (file-backed, per node).
  tyk_apps_2:
  tyk_policies_2:
  tyk_apps_3:
  tyk_policies_3:
    driver: local
  # Caddy's internal CA (pki/authorities/local/*) plus its cert store. See the edge service above.
  caddy_data:
    driver: local
  # WP20: the edge's WAF detection log (edge writes, otel-collector tails) and Prometheus' TSDB.
  edge_logs:
    driver: local
  prometheus_data:
    driver: local
  # OG-OBS-02 (C5): node-exporter textfile markers (`*.prom`) — rw for postgres-backup and the
  # scripts, ro for node-exporter. Scripts find it by the label com.docker.compose.volume=og_textfile.
  og_textfile:
    driver: local

networks:
  open-gateway-network:
    driver: bridge
  # No `internal: true` — postgres and the Ory admin APIs still need their published loopback-only
  # ports for host-side tooling (psql, the migrate-users-to-kratos.ts script, etc). The isolation
  # this buys is that tyk-gateway/tyk-pump were never added to it, not that it can't reach the host.
  ory-internal:
    driver: bridge
