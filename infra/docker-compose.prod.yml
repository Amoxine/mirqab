# Production overlay (WP29a). Layered ON TOP of docker-compose.yml, never used alone:
#
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml \
#     --profile multinode up -d
#
# An overlay file rather than a compose `profile`, and that is forced rather than preferred: a
# profile can only add or withhold whole SERVICES, it cannot change a value on an existing one — and
# the first thing this file has to change is `NODE_ENV` on the `api` service that the base file
# already defines. `--profile multinode` is still passed alongside, because the three gateway nodes
# TYK_ADMIN_URLS names below only exist under that profile.
#
# Required in infra/.env before this file will start anything (see prod-preflight below):
#   REDIS_PASSWORD   openssl rand -hex 32
#   TYK_GW_SECRET    openssl rand -hex 32 — the committed default is rejected
#   DB_PASS          already required by the base file
#   EDGE_IMAGE       the digest-pinned edge image CD last published (WP29b); a tag is rejected
#   PG_EXPORTER_PASSWORD  openssl rand -hex 32 — soft in the base file, required here (OG-OBS-02)
#   KRATOS_SMTP_URI  a real SMTP server (smtps://user:pass@host:465/); the base file's default is the
#                    dev-only Mailpit, which this overlay does not start (it is under `--profile dev`)
# and the seeded admin@opengateway.io / Admin123! login must no longer work. The seed enforces that
# itself under NODE_ENV=production: it refuses to run without ADMIN_EMAIL and ADMIN_PASSWORD
# (docs/go-live.md). infra/.env.production.example lists every variable with how to generate it.
#
# Needs a Docker Compose that knows the `!reset` YAML tag (2.24 or later; only v5.1.4 was run
# against this file). What an OLDER Compose does with the tag is unverified: it may reject it, or it
# may parse it without clearing anything, in which case every `ports: !reset []` below is lost and
# the loopback admin ports and the raw-TCP port are published again, silently. So
# infra/scripts/check-prod-ports.sh asserts both the Compose version and the rendered port list
# (only the edge's five), and deploy-staging.sh runs it before `up`.

# Same cap as the base file's anchor (OG-OBS-01): YAML anchors do not cross files, so the one service
# this overlay defines itself needs its own copy. Keep the two in step.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

# ONE value, three consumers: prod-preflight, api and web all take NODE_ENV from this anchor. That is
# what lets the preflight's NODE_ENV check read the value the application will actually run with; a
# literal on each service (as this file used to have) made the check unable to fail. It catches an
# edit to THIS line, not an edit that swaps one service's alias for a literal.
x-node-env: &prod-node-env production

services:
  # ─── Preflight gate ────────────────────────────────────
  # Runs to completion before api, web and the gateway nodes are allowed to start; a non-zero exit
  # aborts the whole `up`. The checks are in infra/scripts/prod-preflight.sh.
  #
  # It depends on postgres and kratos being HEALTHY rather than on nothing, because one of its
  # checks is behavioural — it asks Kratos to log in as the seeded default admin. Neither of those
  # two services depends on this one, so there is no cycle.
  prod-preflight:
    image: redis:7-alpine
    container_name: open-gateway-prod-preflight
    logging: *default-logging
    entrypoint: ["sh", "/preflight.sh"]
    environment:
      NODE_ENV: *prod-node-env
      TYK_GW_SECRET: ${TYK_GW_SECRET:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      DB_PASS: ${DB_PASS:-}
      # The exact string the pump is handed in the base file, so the check tests what the pump gets
      # rather than what this file hopes it gets.
      TYK_PMP_PUMPS_POSTGRES_META_CONNECTIONSTRING: "host=postgres port=5432 user=opengateway password=${DB_PASS:-} dbname=opengateway sslmode=disable"
      # WP29b: checked here rather than only by the `:?` on the edge service below, so the failure
      # reads as one preflight line among the others instead of a compose interpolation error.
      EDGE_IMAGE: ${EDGE_IMAGE:-}
      # OG-OBS-02: `:-` here only so the check reports it as one preflight line; the two services
      # below make it `:?`, and this adds the shape (no whitespace, at least 32 characters).
      PG_EXPORTER_PASSWORD: ${PG_EXPORTER_PASSWORD:-}
      # Same `:-` / `:?` split as the two above: required by the kratos service below, repeated here
      # so the shape check (not the dev Mailpit address) prints as one preflight line.
      KRATOS_SMTP_URI: ${KRATOS_SMTP_URI:-}
      # The same expression the kratos service below hands Kratos, so the check reads what Kratos gets.
      KRATOS_COOKIE_SECURE: ${KRATOS_COOKIE_SECURE:-true}
      # The same `${COOKIE_SECURE:-true}` the base file hands api and web, so the check reads what they get.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      KRATOS_PUBLIC_URL: http://kratos:4433
    volumes:
      - ./scripts/prod-preflight.sh:/preflight.sh:ro
      - ./pump/pump.conf:/pump.conf:ro
    depends_on:
      postgres:
        condition: service_healthy
      # HEALTHY, not started: the behavioural check below logs in through Kratos' public API, and
      # against a cold Kratos it raced the start-up and failed on a connection refused. Kratos is a
      # long-running service with its own healthcheck, not a one-shot, so waiting on it cannot hang
      # on a secret (rebuild.sh deploys the working tree, and an awaited one-shot that needs a
      # secret blocks it forever when the secret is not there).
      kratos:
        condition: service_healthy
    networks:
      - open-gateway-network
      - ory-internal

  # ─── Redis: password required ──────────────────────────
  # The base file runs Redis unauthenticated behind a loopback-only port. That is defensible for a
  # laptop and indefensible in production: every gateway key, session and quota counter in the stack
  # lives here, and the SSRF split documented in the base file rests on "nothing on
  # open-gateway-network is unauthenticated".
  #
  # `--appendonly yes` is repeated because `command:` REPLACES rather than merges — dropping it here
  # would silently turn durability off, which is the one property WP29a verifies on this service.
  redis:
    command: >-
      redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
      --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD (openssl rand -hex 32)}
    environment:
      # redis-cli reads this, so the healthcheck below needs no -a and the password never appears in
      # `docker inspect`'s Healthcheck.Test or in the process list.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD (openssl rand -hex 32)}
    # The base file's 127.0.0.1:33003 is a laptop convenience (host-side `pnpm dev`). Nothing in
    # production reaches Redis from the host: every client is a container on this network.
    ports: !reset []

  # ─── Gateway nodes: authenticate to Redis ──────────────
  # One per node. The anchor in the base file cannot carry this: it is a per-deployment secret, and
  # the anchor is the "every node runs byte-identical config" contract, which env overrides here
  # preserve — all three get the same value.
  tyk-gateway:
    environment:
      TYK_GW_STORAGE_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD (openssl rand -hex 32)}
    # The base file's `33020:6000` is WP27's demo/test TCP port, published on ALL interfaces and
    # bypassing the edge and its WAF. Production publishes no raw-TCP port by default; an API with
    # `protocol: tcp` needs its own port published deliberately (docs/go-live.md). The listener
    # itself is untouched — Tyk still opens it inside the network, and the blackbox `tcp-33020`
    # probe still dials tyk-gateway:6000 there.
    ports: !reset []
    depends_on:
      prod-preflight:
        condition: service_completed_successfully

  tyk-gateway-2:
    environment:
      TYK_GW_STORAGE_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD (openssl rand -hex 32)}
    depends_on:
      prod-preflight:
        condition: service_completed_successfully

  tyk-gateway-3:
    environment:
      TYK_GW_STORAGE_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD (openssl rand -hex 32)}
    depends_on:
      prod-preflight:
        condition: service_completed_successfully

  # ─── Pump: authenticate to Redis ───────────────────────
  # `analytics_storage_config.password` in pump.conf, as an env override. The path-to-env rule is the
  # one docs/ANALYTICS-PIPELINE.md documents for the connection strings: TYK_PMP_ + the config path,
  # underscores inside a segment removed. Live-verified against pump 1.17.0 on a throwaway
  # password-protected Redis — without it the pump loops on "NOAUTH Authentication required".
  tyk-pump:
    environment:
      TYK_PMP_ANALYTICSSTORAGECONFIG_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD (openssl rand -hex 32)}

  # ─── Postgres monitoring: password required (OG-OBS-02) ──
  # The base file keeps PG_EXPORTER_PASSWORD soft so a laptop without it loses only Postgres
  # monitoring (pg-monitoring-init fails closed). Production does not get that leniency: an unset
  # value stops the whole `up` at interpolation, the same as every other secret in this overlay.
  pg-monitoring-init:
    environment:
      PG_EXPORTER_PASSWORD: ${PG_EXPORTER_PASSWORD:?set PG_EXPORTER_PASSWORD (install.sh generates infra/.env)}

  postgres-exporter:
    environment:
      DATA_SOURCE_PASS: ${PG_EXPORTER_PASSWORD:?set PG_EXPORTER_PASSWORD (install.sh generates infra/.env)}

  # ─── Redis exporter: authenticate to Redis (OG-OBS-02) ──
  # Same pattern as the pump above. redis_exporter reads REDIS_PASSWORD from its environment, so it
  # never appears in the command line. Without it every scrape reports redis_up 0 (NOAUTH).
  redis-exporter:
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD (openssl rand -hex 32)}

  # ─── Ory: real SMTP, Secure session cookie ─────────────
  # The base file's default sends Kratos mail to the dev-only Mailpit container, which this overlay
  # does not start. An unset value would therefore not fail loudly at runtime: Kratos would queue
  # every recovery and verification code and never deliver one. `:?` makes it a start-up error.
  #
  # SESSION_COOKIE_SECURE defaults to TRUE here (the base file's default is false, from when the stack
  # was plain HTTP). Kratos runs with `--dev`, which does not make cookies secure on its own, and
  # without `Secure` the browser attaches the session cookie to plain-HTTP requests to the same
  # hostname too. prod-preflight reads the same expression and fails on anything but `true`.
  kratos:
    environment:
      COURIER_SMTP_CONNECTION_URI: ${KRATOS_SMTP_URI:?set KRATOS_SMTP_URI to a real SMTP server (smtps://user:pass@host:465/)}
      SESSION_COOKIE_SECURE: ${KRATOS_COOKIE_SECURE:-true}
    ports: !reset []

  # ─── No host ports but the edge's ──────────────────────
  # The base file publishes five datastore and admin ports on 127.0.0.1 for a laptop: Postgres 33002,
  # Redis 33003, Hydra admin 33011, Kratos admin 33013, Keto 33014/33015. Production publishes none of
  # them, so the ONLY ports this stack exposes are the edge's five (check-prod-ports.sh asserts it).
  #
  # The one that mattered was the Kratos admin API: it is unauthenticated, and on a loopback port any
  # local user, or any container in host networking (node-exporter runs that way), could mint a
  # recovery link for the super_admin and take the account. Postgres on loopback was the same shape
  # for the database.
  #
  # Everything that used them runs inside the stack instead: web and api reach these as hydra:4445,
  # kratos:4434, keto:4466/4467 and postgres:5432, and the post-deploy login check
  # (apps/api/test/e2e/kratos-hydra-login.e2e.mjs) is `docker cp`ed into the api container and run
  # there (docs/go-live.md).
  postgres:
    ports: !reset []

  hydra:
    ports: !reset []

  keto:
    ports: !reset []

  # ─── Edge: digest-pinned image, fronting all three gateway nodes ───────────────
  # `image` overrides the base file's locally-built `open-gateway-edge:wp26b`. The base file's
  # `build:` stanza is still inherited — a compose overlay cannot remove one — and compose does
  # still attempt a build when the pull fails. That is not a hole, and the reason is worth stating
  # because it is the whole basis of this pin: a locally built image cannot be tagged with a
  # digest, so it can never satisfy a `@sha256:` reference. Verified by pointing this at a digest
  # that does not exist — the pull 403s, the build runs, and the `up` then fails with
  # "No such image: ...@sha256:...". Prod either gets exactly the bytes the digest names or it does
  # not start.
  #
  # `pull_policy: always` is belt-and-braces rather than the guarantee: a digest is
  # content-addressed, so a local copy of that digest is already the same bytes.
  #
  # `:?` rather than a committed default digest, deliberately. A default would be a digest produced
  # on one machine at one moment, and the honest value is whatever CD last published — so the
  # deployment states it and `prod-preflight` refuses anything that is not a sha256 digest. CD
  # writes it into the staging host's .env from the build it just pushed; for a manual deploy:
  #   docker buildx imagetools inspect ghcr.io/<owner>/<repo>/edge:<tag> --format '{{.Manifest.Digest}}'
  #
  # WHAT THIS DIGEST DOES NOT COVER, and it is the easy mistake to make: the Caddyfile is a
  # read-only BIND MOUNT from `./edge/Caddyfile` (base file), not a layer in this image. The image
  # is the Caddy binary and its compiled-in CRS rules; the configuration is mounted at run time. So
  # a Caddyfile change never changes this digest, and re-pinning the digest after editing the
  # Caddyfile proves nothing about the config.
  #
  # The trap that follows is the one worth naming: Caddy reads the Caddyfile ONCE, at start. Edit it
  # and the file on disk is current while the running server is still serving the old config, with
  # nothing in `docker inspect`, in the digest or in a file diff to say so. Apply a Caddyfile change
  # with a reload or a recreate of this service, then confirm against what is LOADED rather than
  # what is on disk:
  #   docker exec open-gateway-edge wget -qO- http://127.0.0.1:2019/config/
  edge:
    image: ${EDGE_IMAGE:?set EDGE_IMAGE to a digest-pinned edge image (ghcr.io/<owner>/<repo>/edge@sha256:...)}
    pull_policy: always
    environment:
      EDGE_GATEWAY_UPSTREAMS: ${EDGE_GATEWAY_UPSTREAMS:-tyk-gateway:8080 tyk-gateway-2:8080 tyk-gateway-3:8080}

  # ─── API ───────────────────────────────────────────────
  # `image` added by WP29b so a CD deploy runs the artifact CI actually tested. The base file gives
  # `api`/`web` a `build:` and no `image:`, so without this the staging host would pull nothing and
  # rebuild from its own checkout — and the images CD published would be decoration.
  #
  # Unlike `edge` this keeps a local-build fallback rather than `:?`. The edge is the one image this
  # repo compiles itself, so a floating edge is a supply-chain hole; api and web are built from the
  # very source tree sitting on the host, so a `docker compose up` with no CD in the picture is a
  # legitimate way to run prod and should not be blocked. Set to a digest, it pulls that digest; left
  # unset, compose builds and tags the fallback name.
  api:
    image: ${API_IMAGE:-open-gateway-api:local}
    environment:
      # app.module.ts reads this directly for the throttler: 100 req/min at production, 1000
      # otherwise. Taken from the same anchor as prod-preflight and web, so the preflight's NODE_ENV
      # check reads this very value; replacing the alias here with a literal would take this service
      # out of the preflight's sight.
      NODE_ENV: *prod-node-env
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD (openssl rand -hex 32)}@redis:6379
      # The three nodes by NAME, never a scaled-up single service. A scaled service is one DNS name
      # behind which the individual containers are not addressable, and the control plane has to
      # reach each node's OWN control API (:8081) to fan a write out and to tell which node drifted.
      # (`grep -r replicas infra/` is an acceptance check and must stay at zero, so the compose key
      # that would do it is deliberately not written out here.)
      TYK_ADMIN_URLS: ${TYK_ADMIN_URLS:-http://tyk-gateway:8081/tyk,http://tyk-gateway-2:8081/tyk,http://tyk-gateway-3:8081/tyk}
    depends_on:
      prod-preflight:
        condition: service_completed_successfully

  # Same reasoning as `api` above.
  web:
    image: ${WEB_IMAGE:-open-gateway-web:local}
    environment:
      NODE_ENV: *prod-node-env
    depends_on:
      prod-preflight:
        condition: service_completed_successfully
