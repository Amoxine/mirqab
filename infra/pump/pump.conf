{
  "analytics_storage_type": "redis",
  "analytics_storage_config": {
    "type": "redis", "host": "redis", "port": 6379,
    "username": "", "password": "", "database": 0,
    "optimisation_max_idle": 100, "enable_cluster": false
  },
  "purge_delay": 10,
  "purge_chunk": 1000,
  "storage_expiration_time": 3600,
  "log_level": "info",
  "dont_purge_uptime_data": true,
  "health_check_endpoint_name": "health",
  "health_check_endpoint_port": 8083,
  "pumps": {
    "postgres": {
      "type": "sql",
      "omit_detailed_recording": true,
      "meta": {
        "type": "postgres",
        "connection_string": "host=postgres port=5432 user=opengateway password= dbname=opengateway sslmode=disable",
        "table_sharding": false,
        "batch_size": 1000
      }
    },
    "prometheus": {
      "type": "prometheus",
      "meta": {
        "listen_address": ":9090",
        "path": "/metrics",
        "custom_metrics": [
          {
            "name": "tyk_http_requests_total",
            "description": "Requests proxied by the gateway, by API, method and response code",
            "metric_type": "counter",
            "labels": ["api_id", "api_name", "method", "response_code"]
          }
        ]
      }
    },
    "postgresaggregate": {
      "type": "sql_aggregate",
      "meta": {
        "type": "postgres",
        "connection_string": "host=postgres port=5432 user=opengateway password= dbname=opengateway sslmode=disable",
        "table_sharding": false,
        "store_analytics_per_minute": false,
        "track_all_paths": false
      }
    }
  }
}
