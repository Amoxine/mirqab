name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://test:test@localhost:5432/test?schema=public
  REDIS_URL: redis://localhost:6379
  JWT_SECRET: test-secret-for-ci-only
  TYK_ADMIN_URL: http://localhost:8080/tyk
  TYK_ADMIN_SECRET: test-secret

jobs:
  ci:
    name: CI Pipeline
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # WP12b guard (DoD-OWNER 8): blocking, and ahead of every other step below — a broken
      # workflow file should fail before anything else even tries to run.
      #
      # WP29b replaced `bash <(curl -s .../main/scripts/download-actionlint.bash)` here. That form
      # fetched an UNPINNED script from a moving branch and piped it straight into a shell with the
      # repo checked out: whatever `main` happened to contain at that second ran with full access to
      # this job. It was also, precisely, the supply-chain shape this WP exists to close — a linter
      # that guards the workflows cannot itself be the softest way in.
      #
      # It runs from the official image, PINNED BY DIGEST, rather than a downloaded binary — and
      # that choice is the fix for a defect this step shipped with. actionlint runs shellcheck on
      # every `run:` block whenever shellcheck is on PATH. It is on ubuntu-latest and it was not on
      # either machine that reviewed this workflow, so a local `actionlint` exited 0 while CI's
      # first step would have gone red on SC2016 (found by worker-3's independent pass, not by us).
      # A downloaded binary leaves shellcheck runner-provided and unpinned, which is both a second
      # unpinned tool in the supply chain and the exact reason local and CI disagreed. The image
      # carries both at fixed versions, so `docker run … rhysd/actionlint@sha256:…` reproduces CI
      # byte for byte on any machine — run that before touching a workflow file.
      #
      # To bump: pull the new tag, then take its digest from
      #   docker buildx imagetools inspect rhysd/actionlint:<VER> --format '{{.Manifest.Digest}}'
      - name: actionlint
        shell: bash
        env:
          # rhysd/actionlint:1.7.12 — the version stays in the tag for readability; the digest is
          # what Docker resolves, and a tag can be repushed.
          ACTIONLINT_IMAGE: rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo:ro" -w /repo "$ACTIONLINT_IMAGE" -color

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --audit-level=high, not critical, and BLOCKING as of WP29b.
      #
      # It used to carry `continue-on-error: true` because `pnpm audit --prod` found 24 (by
      # 2026-09-24: 34) high advisories in real production paths, and a step that is permanently red
      # masks every other step's signal. WP29b triaged them instead of silencing them: all 34 were
      # transitive, every one had a published patched version, and `pnpm.overrides` in the root
      # package.json now forces those versions. The count went 34 -> 0; what is left is 1 low and 5
      # moderate, which this threshold does not gate on.
      #
      # The overrides are deliberately range-scoped where a package has two live majors
      # (`brace-expansion@1` vs `@>=2`, `nanoid@3` vs `@>=4`), so a transitive consumer on the older
      # line gets the patched OLD major rather than an API-breaking bump. `@opentelemetry/sdk-node`
      # could not be overridden alone — it drags in sdk-trace 2.x while the app's sibling OTel
      # packages were on the 0.57 line, which does not typecheck — so apps/api's three direct OTel
      # dependencies moved to the matching 0.222 line together.
      #
      # If a NEW high lands upstream this step now goes red, which is the point. Fix it with an
      # override; if one genuinely cannot be fixed, that is an owner decision and it belongs in this
      # comment next to the reason, not behind continue-on-error.
      - name: Audit dependencies (prod, high+)
        run: pnpm audit --prod --audit-level=high

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Run database migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test?schema=public

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # WP12b guards row: three CI-blocking checks with no package to run them through, so they're
      # plain scripts under infra/scripts/. jsx-no-literals (the guards row's third check) needs no
      # separate step — it's a rule inside the `pnpm lint` config above.
      - name: Guard — docs reference only paths that exist
        run: ./infra/scripts/check-docs-paths.sh

      - name: Guard — locale key sets match across en/fr/ar
        run: node infra/scripts/check-locale-keys.mjs

      - name: Guard — every dashboard page is permission-gated
        run: ./infra/scripts/check-page-gates.sh

      # WP29b: O1 is Compose-only and helm/ + k8s/ were deleted in WP12b. This is what stops them
      # coming back as a second deployment description nobody keeps in step with compose.
      - name: Guard — no Helm/Kustomize (Compose-only, O1)
        run: ./infra/scripts/check-no-k8s.sh

      - name: Format check
        run: pnpm format:check

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # API auth regression (see apps/api/test/e2e/auth.e2e.spec.ts for current scope and why it
      # shrank mid-implementation). Uses @playwright/test's `request` fixture, no browser: it boots
      # the just-built apps/api/dist/main.js itself, so no `playwright install` step is needed here.
      - name: E2E tests (API auth flows)
        run: pnpm --filter @open-gateway/api test:e2e

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────────────────────
  # WP29b: reproduce the edge build in CI.
  #
  # The edge is the ONLY self-compiled artifact in the stack — every other image is pulled from an
  # upstream publisher. Before this job the binary that fronts 100% of traffic was whatever some
  # developer's laptop produced, and nothing in CI would have noticed if it stopped matching the
  # Dockerfile. Building it on every PR means a change to the Caddy version, the coraza-caddy
  # version or the CRS pin fails review rather than surfacing after a deploy.
  #
  # Its own job, not a step in `ci`: it shares nothing with the Node pipeline, and a 3-4 minute Go
  # build should not sit in series with the tests. No push here — publishing is CD's job
  # (cd-staging.yml), which is also where the digest compose pins comes from.
  #
  # The assertions that make this meaningful are inside infra/edge/Dockerfile itself (a `caddy
  # build-info` grep for each pinned module), so they run identically here and on a laptop.
  edge-image:
    name: Edge image (xcaddy + Coraza)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build edge image
        uses: docker/build-push-action@v6
        with:
          context: infra/edge
          push: false
          load: true
          tags: open-gateway-edge:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Belt and braces over the Dockerfile's own RUN assertions: those run at build time and would
      # be skipped wholesale on a fully cached build, and the point of this job is to catch a pin
      # that stopped holding.
      - name: Verify the pinned module set
        run: |
          set -euo pipefail
          info=$(docker run --rm --entrypoint caddy open-gateway-edge:ci build-info)
          echo "$info" | grep -E 'caddyserver/caddy/v2[[:space:]]+v2\.11\.4'
          echo "$info" | grep -E 'corazawaf/coraza-caddy/v2[[:space:]]+v2\.6\.1'
          echo "$info" | grep -E 'corazawaf/coraza-coreruleset/v4[[:space:]]+v4\.25\.0'
