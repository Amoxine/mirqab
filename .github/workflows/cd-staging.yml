name: CD — Staging

on:
  push:
    branches: [main]

concurrency:
  group: cd-staging
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_WEB: ${{ github.repository }}/web
  IMAGE_API: ${{ github.repository }}/api
  IMAGE_EDGE: ${{ github.repository }}/edge

# Read the repo, write packages. Spelled out because the default for a workflow token is broader
# than this job needs, and `packages: write` is the one capability that can publish an artifact the
# staging host will then execute.
permissions:
  contents: read
  packages: write

jobs:
  # ───────────────────────────────────────────────────────────────────────────────────────────────
  # Build and publish, emitting each image's DIGEST rather than only a tag.
  #
  # The digests are what the deploy job hands the host: a tag can be repushed between this job and
  # the next, and `infra/docker-compose.prod.yml` requires the edge by digest for exactly that
  # reason (prod-preflight refuses a tag).
  build:
    name: Build and publish images
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    outputs:
      web: ${{ steps.web.outputs.digest }}
      api: ${{ steps.api.outputs.digest }}
      edge: ${{ steps.edge.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `NEXT_PUBLIC_*` are inlined into the CLIENT BUNDLE at build time — they are not read when
      # the container starts, so setting them in compose on the staging host does nothing. Without
      # these build args the published image ships the Dockerfile's localhost defaults and every
      # browser that loads staging calls `https://localhost:33001/api`, which resolves to the
      # VIEWER'S own machine. Repository variables, not secrets: they are public URLs that end up
      # in a bundle anyone can read, and `vars` keeps them visible in the run log where a wrong one
      # is diagnosable. Unset, they fall back to the Dockerfile defaults, which is why the health
      # check below now probes the web app too rather than trusting this to be configured.
      - name: Build and push Web image
        id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_WEB }}:staging-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.STAGING_API_URL }}
            NEXT_PUBLIC_KRATOS_URL=${{ vars.STAGING_KRATOS_URL }}
            NEXT_PUBLIC_HYDRA_URL=${{ vars.STAGING_HYDRA_URL }}
            NEXT_PUBLIC_APP_URL=${{ vars.STAGING_APP_URL }}
            NEXT_PUBLIC_GATEWAY_URL=${{ vars.STAGING_GATEWAY_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push API image
        id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_API }}:staging-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # WP29b: the edge is built and published HERE rather than on a developer's laptop. It is the
      # only self-compiled artifact in the stack (infra/edge/Dockerfile pins Caddy, coraza-caddy and
      # the CRS ruleset, and asserts all three at build time), and its digest is what
      # infra/docker-compose.prod.yml requires.
      - name: Build and push Edge image
        id: edge
        uses: docker/build-push-action@v6
        with:
          context: infra/edge
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_EDGE }}:staging-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record published digests
        run: |
          {
            echo "### Published images"
            echo ''
            echo '| image | digest |'
            echo '| --- | --- |'
            echo "| web | \`${{ steps.web.outputs.digest }}\` |"
            echo "| api | \`${{ steps.api.outputs.digest }}\` |"
            echo "| edge | \`${{ steps.edge.outputs.digest }}\` |"
            echo ''
            echo 'For a manual deploy, set in the host'"'"'s infra/.env:'
            echo ''
            echo '```'
            echo "EDGE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_EDGE }}@${{ steps.edge.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────────────────────────────────────────────────────────────────────────
  # Deploy to the staging host over SSH and prove it came back up.
  #
  # Gated on `vars.STAGING_DEPLOY == 'true'` rather than running unconditionally. Every secret below
  # is repo-specific infrastructure that a fork or a fresh clone does not have, and a CD job that
  # fails on every push to main is a red build everyone learns to ignore — which is how the health
  # check this replaces came to be an `echo` in the first place. Setting the variable is the
  # explicit statement that the secrets exist.
  #
  # Required (documented in docs/deployment.md § "CD — staging"):
  #   vars.STAGING_DEPLOY        'true' to enable this job
  #   secrets.STAGING_SSH_HOST   hostname or IP of the staging host
  #   secrets.STAGING_SSH_USER   user with permission to run docker compose there
  #   secrets.STAGING_SSH_KEY    private key, PEM, no passphrase
  #   secrets.STAGING_KNOWN_HOSTS  `ssh-keyscan <host>` output — NOT optional, see below
  #   secrets.STAGING_PATH       absolute path to the checkout on that host
  #   secrets.STAGING_HEALTH_URL e.g. https://staging.example.com/api/health
  deploy:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && vars.STAGING_DEPLOY == 'true'
    environment: staging

    # Narrower than the workflow default this would otherwise inherit. `build` needs
    # `packages: write` to push; this job only reads the repo and talks to the staging host over
    # SSH, and the job holding the deploy key is the last one that should also be able to publish
    # an image.
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No third-party action for this: a deploy key with write access to the staging host is the
      # most valuable secret in the repository, and every extra action in the path is another
      # publisher who could reach it. `ssh` and `install` are already on the runner.
      #
      # StrictHostKeyChecking stays ON and known_hosts is a required secret. `accept-new` would
      # make the very first connection — the one an attacker would race — trust whatever answered.
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # Pull by DIGEST, not by the tag just pushed. Between the build job and this one the tag could
      # have been repushed; the digest names the exact bytes CI tested.
      #
      # `pull` before `up` so an image that cannot be fetched fails while the old stack is still
      # serving, rather than half way through a recreate.
      - name: Deploy
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          REMOTE_PATH: ${{ secrets.STAGING_PATH }}
          DEPLOY_SHA: ${{ github.sha }}
          WEB_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_WEB }}@${{ needs.build.outputs.web }}
          API_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_API }}@${{ needs.build.outputs.api }}
          EDGE_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_EDGE }}@${{ needs.build.outputs.edge }}
        run: |
          set -euo pipefail
          # The body lives in infra/scripts/deploy-staging.sh and is piped in, so the same steps run
          # for a manual deploy and are reviewed like any other code.
          #
          # The values go over as an `export` prelude built with printf %q, NOT as
          # `VAR='$VALUE' bash -s` on the remote command line. That earlier form was quoted by hand
          # and a value containing a single quote closed the quoting and ran the remainder as a
          # command on the staging host — demonstrated, not theorised. %q emits a token that
          # survives being re-parsed by the remote shell, so these stay data whatever they contain.
          {
            printf 'export REMOTE_PATH=%q DEPLOY_SHA=%q WEB_IMAGE=%q API_IMAGE=%q EDGE_IMAGE=%q\n' \
              "$REMOTE_PATH" "$DEPLOY_SHA" "$WEB_IMAGE" "$API_IMAGE" "$EDGE_IMAGE"
            cat infra/scripts/deploy-staging.sh
          } | ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" 'bash -s'

      # A real probe with a real failure. `--fail` turns a 5xx into a non-zero exit, and the retry
      # loop covers the window where the containers are up but the API has not finished booting —
      # without it this races the deploy and reports whichever side won.
      # Two probes, because one was not enough to make a bad deploy loud. The API probe alone went
      # green while the web bundle could be pointing every visitor's browser at their own localhost
      # (the NEXT_PUBLIC_* build args above) — the app was "healthy" and unusable, and nothing in
      # this job would have said so.
      #
      # The web probe asserts the SERVED JAVASCRIPT, and the three details below are each a way an
      # earlier version of it silently could not fail (all three found by worker-3):
      #
      #   1. it fetched `$APP_URL` and grepped the RESPONSE BODY. `/` answers 307 with a 31-byte
      #      redirect stub, and `curl --fail` does not fail on a 3xx — so the grep ran over 31 bytes
      #      of nothing, every time. It now fetches a page that really renders, and follows
      #      redirects.
      #   2. it grepped the HTML. `NEXT_PUBLIC_*` values are inlined into the JS CHUNKS, not the
      #      document: the API URL appears 0 times in the HTML of a correctly built image. The only
      #      place worth looking is the chunks the page references.
      #   3. it asserted the ABSENCE of `localhost`, which would have failed a CORRECT deploy. Even
      #      a properly built bundle ships a chunk containing the literal `localhost:33001`, from
      #      the source fallback `"" === o ? "http://localhost:33001/api" : o`. Measured: expected
      #      URL 0 / localhost 1 on a defaults build, expected URL 1 / localhost 1 on an args build.
      #      Absence is therefore not a signal; PRESENCE of the expected URL is.
      #
      # So: fetch a public page, follow its chunk URLs, require the expected API URL to appear in
      # what was actually served. Finding no chunks at all is a failure too — a probe that passes
      # because it looked at nothing is the bug this whole comment is about.
      - name: Health check
        env:
          HEALTH_URL: ${{ secrets.STAGING_HEALTH_URL }}
          APP_URL: ${{ vars.STAGING_APP_URL }}
          API_URL: ${{ vars.STAGING_API_URL }}
          # A second variable, because asserting only the API URL let an image built with ONLY
          # NEXT_PUBLIC_API_URL through — which is exactly what CD renders when the other four repo
          # variables are unset. Kratos is the one other value observable from this page: 2 chunks
          # in a fully-built image, 0 in a partial one. Hydra, App and Gateway appear in 0 chunks of
          # the login page even when correctly built, so they are NOT asserted here; see the docs.
          KRATOS_URL: ${{ vars.STAGING_KRATOS_URL }}
          # A public page that renders the app shell. Not `/`, which only redirects. If this route
          # ever moves, this check fails loudly rather than quietly passing — which is the correct
          # direction for it to break in.
          PROBE_PATH: /portal/auth/login
        run: |
          set -euo pipefail

          healthy=''
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 10 "$HEALTH_URL" > /tmp/health.json; then
              echo "api healthy after ${attempt} attempt(s):"
              cat /tmp/health.json
              healthy=yes
              break
            fi
            echo "attempt ${attempt}: api not healthy yet"
            sleep 5
          done
          if [ -z "$healthy" ]; then
            echo "::error::staging api did not become healthy within 150s of the deploy" >&2
            exit 1
          fi

          # Trailing slashes turn every chunk fetch into `//_next/...`, which Next answers with a
          # 308. Without -L `--fail` counts that as success with an empty body, so a CORRECT image
          # reports red with a message blaming the build args — the worst kind of wrong, since the
          # message sends you to fix something that is not broken.
          #
          # ALL of them, not one: `${APP_URL%/}` strips a single trailing slash, so a variable ending
          # `//` still produced the 308 and still failed a correct image.
          while [ "${APP_URL%/}" != "$APP_URL" ]; do
            APP_URL="${APP_URL%/}"
          done

          if [ -z "${APP_URL:-}" ] || [ -z "${API_URL:-}" ] || [ -z "${KRATOS_URL:-}" ]; then
            echo "::error::vars.STAGING_APP_URL, STAGING_API_URL and STAGING_KRATOS_URL must all be set, or the web image was built with the Dockerfile's localhost defaults" >&2
            exit 1
          fi

          # -L, because the page may redirect and a 3xx is not a curl failure.
          if ! curl --fail --silent --show-error --location --max-time 15 "$APP_URL$PROBE_PATH" > /tmp/app.html; then
            echo "::error::staging web app did not answer at $APP_URL$PROBE_PATH" >&2
            exit 1
          fi

          # `|| true` is load-bearing: grep exits 1 when it matches nothing, `pipefail` propagates
          # that, and `set -e` then killed the step BEFORE the diagnostic below could print. The
          # step still failed, which is why this went unnoticed — it failed closed and silent, and
          # a check whose failure says nothing is most of the way back to no check at all.
          grep -oE '/_next/static/[^"]+\.js' /tmp/app.html | sort -u > /tmp/chunks.txt || true
          chunk_count=$(wc -l < /tmp/chunks.txt)
          if [ "$chunk_count" -eq 0 ]; then
            echo "::error::no /_next/static chunk URLs in $PROBE_PATH — this check cannot assert anything, treat it as failed" >&2
            exit 1
          fi

          # Matched WITH THE SURROUNDING DOUBLE QUOTES, so the value has to be the whole inlined
          # string literal. A bare substring match passes on any PREFIX of what was built: with
          # `https://staging.example.com` as the variable, a bundle built with
          # `https://staging.example.com/api` matches and the mismatch goes unreported. Verified on
          # a real minified chunk, which inlines it as `let r="https://staging.example.com/api",` —
          # exact value quoted: 1 hit; prefix quoted: 0; truncated value quoted: 0.
          api_hits=0
          kratos_hits=0
          while IFS= read -r chunk; do
            curl --fail --silent --show-error --max-time 15 "$APP_URL$chunk" > /tmp/chunk.js || continue
            grep -qF "\"$API_URL\"" /tmp/chunk.js && api_hits=$((api_hits + 1))
            grep -qF "\"$KRATOS_URL\"" /tmp/chunk.js && kratos_hits=$((kratos_hits + 1))
          done < /tmp/chunks.txt

          if [ "$api_hits" -eq 0 ]; then
            echo "::error::none of the $chunk_count served chunks contain \"$API_URL\" — the NEXT_PUBLIC_* build args did not reach this image, and browsers will call the Dockerfile's localhost defaults" >&2
            exit 1
          fi
          if [ "$kratos_hits" -eq 0 ]; then
            echo "::error::the served chunks carry $API_URL but not \"$KRATOS_URL\" — only SOME build args reached this image, or the probe's page no longer inlines it; check every STAGING_*_URL repo variable, then PROBE_PATH" >&2
            exit 1
          fi
          echo "web app healthy: api in $api_hits and kratos in $kratos_hits of $chunk_count served chunks"

  # A push to main that does NOT deploy says so, once, instead of leaving an empty CD run that
  # looks like a successful deployment to anyone scanning the Actions tab.
  deploy-skipped:
    name: Deploy to staging (not configured)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && vars.STAGING_DEPLOY != 'true'

    # It writes one paragraph to the step summary. There is no reason for it to hold the token that
    # can publish an image, which is what it would inherit from the workflow default.
    permissions:
      contents: read

    steps:
      - name: Explain
        run: |
          {
            echo '### Staging deploy skipped'
            echo ''
            echo 'Images were built and published, but no deployment ran:'
            # Double quotes with escaped backticks, matching the digest summary in the build job.
            # In single quotes shellcheck reads the backticks as a command substitution that will
            # not expand (SC2016) and fails the actionlint step — which runs shellcheck on every
            # `run:` block whenever shellcheck is on PATH, as it is on ubuntu-latest.
            echo "\`vars.STAGING_DEPLOY\` is not \`true\` for this repository."
            echo ''
            echo 'See docs/deployment.md § "CD — staging" for the variable and the six secrets'
            echo 'the deploy job needs.'
          } >> "$GITHUB_STEP_SUMMARY"
